<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pa'l Antojo App</title>
<meta name="theme-color" content="#1A1A1A">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icono-192.png">
<link rel="apple-touch-icon" href="icono-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap">
<style>
/* Caja de la tienda: barra arriba con tasa y estado, pestañas, y un panel por pestaña. Una columna en teléfono. */
:root {
  --brand: #F2B705; --ink: #1A1A1A; --bg: #FBF8EF; --surface: #FFFFFF; --line: #E6E0CF; --muted: #6B6B6B;
  --ok: #1F7A3A; --okbg: #E5F4E4; --bad: #B3261E; --badbg: #FBEBEB; --warnbg: #FFF4D1;
  --fg: var(--ink); --onbrand: #1A1A1A;
  --display: "Fredoka", "Trebuchet MS", system-ui, sans-serif;
  --body: "Nunito", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) { :root {
  --bg: #151410; --surface: #201E18; --line: #38342A; --fg: #F3EEE0; --muted: #A8A291;
  --ok: #6FCF8A; --okbg: #1B3324; --bad: #F08A82; --badbg: #3A1E1C; --warnbg: #3A3115; color-scheme: dark } }
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--fg); font: 15px/1.45 var(--body); padding-bottom: env(safe-area-inset-bottom, 0px); }
h1, h2, h3 { font-family: var(--display); margin: 0; line-height: 1.15; }
h2 { font-size: 1.25rem; } h3 { font-size: 1.02rem; }
p { margin: 0; }
[hidden] { display: none !important; }
.top { position: sticky; top: 0; z-index: 3; background: var(--ink); color: #F3EEE0; padding: calc(8px + env(safe-area-inset-top, 0px)) max(14px, env(safe-area-inset-right, 0px)) 8px max(14px, env(safe-area-inset-left, 0px)); display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; justify-content: space-between; }
.top h1 { color: var(--brand); font-size: 1.15rem; }
.top .r { display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: center; font-size: .85rem; }
.top label { display: flex; align-items: center; gap: 6px; color: #F3EEE0; font-weight: 700; }
.top .tinfo { font-size: .78rem; color: #CFC8B4; display: flex; gap: 6px; align-items: center; }
.top .tinfo button { white-space: nowrap; padding: 2px 8px; font-size: .78rem; background: var(--brand); color: var(--ink); border: 0; font-weight: 700; cursor: pointer; }
.top .reloj { font-size: .85rem; font-weight: 700; color: #F3EEE0; white-space: nowrap; font-variant-numeric: tabular-nums; }
.top .reloj.w { color: var(--brand); }
.top input { width: 90px; padding: 4px 8px; background: #2A2822; color: #F3EEE0; border: 1px solid #4A463A; }
.dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; background: #888; margin-right: 5px; }
.dot.ok { background: #6FCF8A; } .dot.w { background: var(--brand); } .dot.bad { background: #F08A82; }
.top .menuBtn { background: none; border: 0; color: var(--brand); font-size: 1.5rem; line-height: 1; padding: 2px 6px 4px 0; cursor: pointer; }
.top .izq { display: flex; align-items: center; gap: 4px; }
/* Menú lateral: fijo en PC, cajón que se abre con ☰ en el teléfono. Cada módulo es una entrada. */
.lado { position: fixed; z-index: 5; top: 0; bottom: 0; left: 0; width: 240px; background: var(--surface); border-right: 1px solid var(--line);
  padding: calc(14px + env(safe-area-inset-top, 0px)) 10px 14px max(10px, env(safe-area-inset-left, 0px)); overflow-y: auto; display: flex; flex-direction: column; gap: 2px;
  transform: translateX(-100%); transition: transform .2s; }
.lado.abierto { transform: none; box-shadow: 0 0 40px rgba(0,0,0,.35); }
.lado .marca { display: flex; align-items: center; gap: 10px; padding: 0 6px 12px; font: 700 1.1rem var(--display); }
.lado .marca img { width: 36px; height: 36px; border-radius: 50%; }
.lado .grupo { font: 800 .7rem var(--body); letter-spacing: .07em; text-transform: uppercase; color: var(--muted); padding: 12px 10px 4px; }
.lado button, .lado a { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; background: transparent; border: 0; border-radius: 10px;
  padding: 9px 10px; font: 800 .95rem var(--body); color: var(--fg); cursor: pointer; text-decoration: none; }
.lado button:hover, .lado a:hover { background: var(--warnbg); }
.lado button[aria-current="page"] { background: var(--brand); color: var(--onbrand); }
.lado .ico { width: 22px; text-align: center; }
.lado .pie { margin-top: auto; padding-top: 12px; }
.velo { position: fixed; inset: 0; z-index: 4; background: rgba(0,0,0,.35); }
@media (min-width: 900px) {
  .lado { transform: none; transition: none; }
  .lado.abierto { box-shadow: none; }
  .velo, .top .menuBtn { display: none; }
  body { padding-left: 240px; }
}
/* Vender: productos a la izquierda, factura a la derecha (abajo en el teléfono) */
main.ancho { max-width: 1200px; }
.ajustes { display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 340px), 1fr)); align-items: start; }
.ajustes .card { height: 100%; align-content: start; }
.ajdatos { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 6px 14px; font-size: .92rem; }
.ajdatos span { color: var(--muted, #6B6B6B); } .ajdatos b { overflow-wrap: anywhere; }
.barra { height: 8px; border-radius: 99px; background: var(--line); overflow: hidden; } .barra i { display: block; height: 100%; background: #2E9E5B; } .barra.llena i { background: #B3261E; }
.vender { display: grid; gap: 14px; align-items: start; }
@media (min-width: 760px) { .vender { grid-template-columns: minmax(0, 1fr) 340px; } .vfac { position: sticky; top: calc(var(--topH, 48px) + 12px); } .vpie { display: none !important; } }
.vbar { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
.vgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.vcard { display: grid; gap: 0; padding: 0; overflow: hidden; border: 0; box-shadow: 0 1px 3px rgb(0 0 0 / .08), 0 4px 12px rgb(0 0 0 / .05); border-radius: 16px; background: var(--surface); color: var(--fg); cursor: pointer; text-align: left; }
.vcard b { font: 600 1.05rem var(--display); padding: 8px 10px 10px; }
.vph { position: relative; overflow: hidden; display: grid; place-items: center; aspect-ratio: 4 / 3; font-size: 2.6rem; background: radial-gradient(circle at 30% 25%, #FFD54A, var(--brand) 70%); }
.vph img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.vph.mini { width: 56px; aspect-ratio: 1; border-radius: 10px; font-size: 1.6rem; grid-row: span 3; }
.vprods, .vopts, .vformas { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
.vprod { display: grid; grid-template-columns: auto 1fr; column-gap: 10px; align-content: start; text-align: left; padding: 12px; min-height: 72px; border: 0; border-radius: 14px; background: var(--surface); box-shadow: 0 1px 3px rgb(0 0 0 / .08); color: var(--fg); cursor: pointer; font: inherit; }
.vprod > b, .vprod > small, .vprod > .vp { grid-column: 2; }
.vprod:not(:has(.vph)) > * { grid-column: 1 / -1; }
.vprod b { font-weight: 800; font-size: 1rem; }
.vprod small { color: var(--muted); font-size: .8rem; }
.vprod .vp { font: 700 1rem var(--display); margin-top: 4px; }
.vprod:active, .vcard:active { transform: scale(.97); }
.vprod.agot { opacity: .45; }
.velegir { border-color: var(--brand); box-shadow: 0 0 0 2px var(--brand); margin-bottom: 10px; }
.velegir small { color: var(--muted); font: 700 .85rem var(--body); }
.vfac h2 { margin-bottom: 4px; }
.vlin { display: grid; gap: 6px; }
.vl { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 10px; align-items: center; font-variant-numeric: tabular-nums; }
.vl .nm small { display: block; color: var(--muted); }
.vq { display: inline-flex; align-items: center; gap: 6px; }
.vq button { width: 34px; height: 34px; border-radius: 50%; border: 0; background: var(--line); color: var(--fg); font: 800 1.1rem var(--body); cursor: pointer; }
.vq b { min-width: 18px; text-align: center; }
.vtot { display: flex; justify-content: space-between; align-items: baseline; border-top: 2px dashed var(--line); padding-top: 8px; font: 700 1.4rem var(--display); }
.vtot small, .vbig small, .vvuelto small { display: block; font: 700 .85rem var(--body); color: var(--muted); text-align: right; }
.vcobrar { width: 100%; font-size: 1.15rem; padding: 14px; }
.vpie { position: sticky; bottom: 0; display: flex; justify-content: space-between; align-items: center; gap: 10px; background: var(--surface); border-top: 1px solid var(--line); margin: 0 -14px -40px; padding: 10px 14px calc(10px + env(safe-area-inset-bottom, 0px)); font-size: 1.05rem; }
.vbig { background: var(--ink); color: var(--brand); border-radius: 16px; padding: 14px 16px; display: grid; gap: 2px; margin-bottom: 12px; }
.vbig span { color: #F3EEE0; font-weight: 700; }
.vbig b { font: 700 2.4rem var(--display); line-height: 1.1; }
.vbig small { text-align: left; color: #F3EEE0; font-size: 1rem; }
.vbig small.bad { color: #F08A82; }
.cobrar h3 { margin: 4px 0 8px; }
.vformas { margin-bottom: 10px; }
.vformas .vprod { min-height: 56px; align-content: center; }
.vpago { margin-bottom: 10px; }
.vmonto { font-size: 1.3rem !important; max-width: 200px; }
.vfalta { font: 700 1.2rem var(--display); color: var(--bad); }
.vvuelto { background: var(--okbg); color: var(--ok); border-radius: 14px; padding: 10px 14px; font: 700 1.2rem var(--display); display: flex; justify-content: space-between; align-items: baseline; gap: 10px; margin: 8px 0; }
.vvuelto b { font-size: 1.8rem; }
#vestado { display: grid; gap: 6px; margin: 6px 0 12px; }
.vlisto { max-width: 460px; margin: 30px auto; text-align: center; justify-items: center; }
.vok { width: 72px; height: 72px; border-radius: 50%; background: var(--okbg); color: var(--ok); display: grid; place-items: center; font-size: 2.4rem; font-weight: 800; }
main.modulo { max-width: none; padding: 0; display: block; }
main.modulo iframe { display: block; width: 100%; height: calc(100vh - var(--topH, 48px)); height: calc(100dvh - var(--topH, 48px)); border: 0; }
.badge { display: inline-grid; place-items: center; min-width: 20px; height: 20px; padding: 0 5px; margin-left: 4px; border-radius: 999px; background: var(--fg); color: var(--surface); font: 800 .72rem var(--body); }
.badge.red { background: var(--bad); color: #fff; }
main { max-width: 900px; margin: 0 auto; padding: 14px max(14px, env(safe-area-inset-right, 0px)) 40px max(14px, env(safe-area-inset-left, 0px)); display: grid; gap: 14px; }
.hint, .note { color: var(--muted); font-size: .88rem; }
.card { border: 1.5px solid var(--line); border-radius: 14px; padding: 12px; display: grid; gap: 8px; background: var(--surface); min-width: 0; }
.card.new { animation: pop .7s ease; }
@keyframes pop { from { background: var(--warnbg); } }
.oh { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 4px 10px; align-items: baseline; }
.id { font: 700 1rem var(--display); font-variant-numeric: tabular-nums; }
.meta { color: var(--muted); font-size: .85rem; }
.pill { font: 800 .7rem var(--body); text-transform: uppercase; letter-spacing: .05em; border-radius: 6px; padding: 2px 7px; background: var(--line); white-space: nowrap; }
.pill.w { background: var(--warnbg); } .pill.g { background: var(--okbg); color: var(--ok); } .pill.r { background: var(--badbg); color: var(--bad); }
.lines { display: grid; gap: 3px; font-variant-numeric: tabular-nums; }
.ln { display: grid; grid-template-columns: auto minmax(0, 1fr) auto auto; gap: 8px; align-items: center; }
.ln .nm { min-width: 0; overflow-wrap: anywhere; }
.ln .nm small { color: var(--muted); display: block; }
.tot { display: flex; justify-content: space-between; font: 700 1.05rem var(--display); border-top: 1px dashed var(--line); padding-top: 6px; font-variant-numeric: tabular-nums; }
.acts { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.btn { border: 0; background: var(--fg); color: var(--surface); border-radius: 10px; padding: 10px 14px; font: 800 .9rem var(--body); cursor: pointer; }
.btn.brand { background: var(--brand); color: var(--onbrand); }
.btn.ghost { background: var(--line); color: var(--fg); }
.btn.link { border: 0; background: none; color: var(--bad); padding: 8px 4px; }
.btn.big { padding: 14px 18px; font-size: 1rem; }
.btn:disabled { opacity: .4; cursor: not-allowed; }
.q { display: inline-flex; align-items: center; gap: 6px; }
.q button { width: 28px; height: 28px; border-radius: 50%; border: 0; background: var(--line); color: var(--fg); font: 700 1rem var(--body); cursor: pointer; line-height: 1; }
.q span { min-width: 1.3em; text-align: center; font-weight: 800; }
.x { border: 0; background: none; color: var(--bad); font: 800 1rem var(--body); cursor: pointer; padding: 2px 6px; }
button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 3px solid var(--brand); outline-offset: 2px; }
label { display: grid; gap: 3px; font-size: .8rem; font-weight: 700; color: var(--muted); }
input, select, textarea { font: 700 .95rem var(--body); color: var(--fg); background: var(--surface); border: 1.5px solid var(--line); border-radius: 8px; padding: 7px 9px; min-width: 0; width: 100%; }
textarea { font-weight: 600; resize: vertical; }
.fields { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 8px; align-items: end; }
/* Inventario: filas que no cortan los nombres. En teléfono el nombre va solo en su línea. */
.irow { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) auto; gap: 8px; align-items: end; padding: 10px 0; border-top: 1px solid var(--line); }
.irow:first-of-type { border-top: 0; padding-top: 2px; }
.irow .ancho { grid-column: 1 / -1; }
.irow .x { align-self: center; padding: 8px 6px; }
.ucant { display: flex; align-items: center; gap: 6px; }
.ucant span { color: var(--muted); font-weight: 700; font-size: .85rem; white-space: nowrap; }
.mov { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 10px; padding: 9px 0; border-top: 1px solid var(--line); align-items: center; }
.mov:first-child { border-top: 0; }
.mov b { font-weight: 800; } .mov .mq { font-weight: 800; white-space: nowrap; display: flex; flex-direction: column; align-items: flex-end; }
/* Llegó una factura: varias líneas de una vez, con su foto */
.fotofac { display: flex; align-items: center; gap: 10px; margin: 8px 0; }
.fotofac img { width: 64px; height: 86px; object-fit: cover; border-radius: 8px; border: 1.5px solid var(--line); }
.subir { position: relative; overflow: hidden; }
.subir input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
#visor { position: fixed; inset: 0; background: rgba(0,0,0,.88); z-index: 50; display: grid; place-items: center; padding: 12px; }
#visor img { max-width: 100%; max-height: calc(100vh - 80px); border-radius: 8px; background: #fff; }
#visor button { position: absolute; top: 12px; right: 12px; }
.fline { padding: 10px 0; border-top: 1px solid var(--line); display: grid; gap: 6px; }
.fline:first-of-type { border-top: 0; }
.fline.fuera { opacity: .5; }
.fline .meta { font-size: .85rem; }
@media (max-width: 639px) { .fields .ancho { grid-column: 1 / -1; } }
@media (min-width: 640px) {
  .irow { grid-template-columns: minmax(0, 2fr) minmax(0, 1fr) auto; }
  .irow.c4 { grid-template-columns: minmax(0, 2fr) 110px minmax(0, 1fr) auto; }
  .irow .ancho { grid-column: auto; }
}
.chk { display: flex; gap: 8px; align-items: center; font-size: .9rem; color: var(--fg); font-weight: 700; }
.chk input { width: 18px; height: 18px; flex: none; }
.msg { font-size: .88rem; font-weight: 700; border-radius: 8px; padding: 7px 10px; }
.msg + .msg { margin-top: 6px; }
.msg.ok { background: var(--okbg); color: var(--ok); } .msg.bad { background: var(--badbg); color: var(--bad); } .msg.w { background: var(--warnbg); }
.empty { text-align: center; color: var(--muted); padding: 22px 10px; border: 1.5px dashed var(--line); border-radius: 12px; }
.drop { border: 2px dashed var(--line); border-radius: 14px; padding: 14px; display: grid; gap: 10px; background: var(--surface); }
.drop.over { border-color: var(--brand); background: var(--warnbg); }
.shot { max-width: 220px; max-height: 320px; border-radius: 10px; border: 1px solid var(--line); object-fit: contain; }
.shots { display: flex; flex-wrap: wrap; gap: 8px; align-items: flex-start; }
.pago { border: 1.5px solid var(--line); border-radius: 12px; padding: 10px; display: grid; gap: 8px; background: var(--bg); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.seg button[aria-pressed="true"] { background: var(--fg); color: var(--surface); }
.vprod[aria-pressed="true"] { background: var(--brand); color: var(--onbrand); }
.vprod[aria-pressed="true"] small { color: var(--onbrand); opacity: .75; }
.chips button { border: 0; background: var(--line); color: var(--fg); border-radius: 999px; padding: 6px 12px; font: 700 .82rem var(--body); cursor: pointer; }
.pila { display: grid; gap: 10px; }
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; }
.kpi { border: 1.5px solid var(--line); border-radius: 12px; padding: 10px; display: grid; gap: 2px; background: var(--surface); }
.kpi small { color: var(--muted); font-weight: 700; font-size: .8rem; }
.kpi b { font: 700 1.3rem var(--display); font-variant-numeric: tabular-nums; }
.kpi.main { background: var(--brand); border-color: var(--brand); color: var(--onbrand); }
.kpi.main small { color: var(--onbrand); }
.tbl { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: .9rem; font-variant-numeric: tabular-nums; }
th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); vertical-align: middle; }
th { font-size: .74rem; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); }
td.n, th.n { text-align: right; }
td input { width: 80px; padding: 4px 6px; }
.low { color: var(--bad); font-weight: 800; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); background: var(--fg); color: var(--surface); padding: 10px 16px; border-radius: 12px; font-weight: 800; font-size: .9rem; max-width: calc(100% - 32px); z-index: 9; }
details summary { cursor: pointer; font-weight: 800; }
#globo { position: fixed; z-index: 60; max-width: min(260px, calc(100vw - 16px)); padding: 6px 10px; border-radius: 8px; background: var(--fg); color: var(--surface);
  font: 600 .8rem/1.35 var(--body); box-shadow: 0 4px 14px rgba(0,0,0,.18); pointer-events: none; opacity: .96; }
@media print { #globo { display: none !important; } }
#ticket { display: none; }
/* ---------- Ajustes para cualquier pantalla (teléfono, tablet, PC) ---------- */
/* Reportes */
.rleyenda { font-size: .8rem; color: var(--muted); display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.rleyenda i { display: inline-block; width: 12px; height: 12px; border-radius: 3px; margin-left: 4px; }
.rd { background: var(--brand); } .rn { background: var(--fg); } .rleyenda .rm { width: 3px; background: var(--bad); }
.rbarras { display: grid; gap: 6px; }
.rfila { display: grid; grid-template-columns: 92px minmax(0, 1fr) 74px; gap: 8px; align-items: center; font-variant-numeric: tabular-nums; }
.rf { font-size: .82rem; color: var(--muted); font-weight: 700; white-space: nowrap; }
.rbar { position: relative; display: flex; height: 18px; border-radius: 6px; background: var(--bg); overflow: hidden; }
.rbar::after { content: ""; position: absolute; top: 0; bottom: 0; left: var(--meta); width: 2px; background: var(--bad); }
.rbar i { display: block; height: 100%; }
.rv { text-align: right; font-size: .9rem; }
td.n { white-space: nowrap; }
.kpis.k3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
@media (max-width: 400px) { .kpis.k3 .kpi { padding: 8px; } .kpis.k3 .kpi b { font-size: 1.05rem; } }
@media (max-width: 400px) { .rfila { grid-template-columns: 70px minmax(0, 1fr) 64px; } .rf { font-size: .75rem; } }
.reclista { display: grid; gap: 6px; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
.reclista .vprod { min-height: 0; padding: 10px; }
.pedidos { display: grid; gap: 14px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 380px), 1fr)); align-items: start; }
.kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); }
@media (min-width: 640px) { .kpis { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
.vcard { grid-template-rows: auto 1fr; }
.vcard b { align-self: center; }
.vph { aspect-ratio: 16 / 10; }
.vprods:has(.vph.mini) { grid-template-columns: repeat(auto-fill, minmax(min(100%, 230px), 1fr)); }
.vpie > span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
@media (max-width: 759px) { body:has(.vpie) .toast { bottom: calc(84px + env(safe-area-inset-bottom, 0px)); } }

/* Barras de desplazamiento: ocultas (se sigue bajando con el dedo, la rueda o el touchpad).

<body>
<header class="top" id="top">
  <div class="izq"><button class="menuBtn" id="menuBtn" aria-label="Abrir el menú" aria-controls="lado" aria-expanded="false">☰</button><h1 id="titulo">Caja Pa'l Antojo</h1></div>
  <div class="r">
    <label for="tasaTop"><span class="lt">Tasa </span>Bs/$ <input id="tasaTop" inputmode="decimal" placeholder="Ej. 230"></label>
    <span id="tasaInfo" class="tinfo"></span>
    <span id="reloj" class="reloj" aria-label="Hora de Venezuela"></span>
    <span id="syncTxt"><span class="dot"></span>…</span>
  </div>
</header>
<nav class="lado" id="lado" aria-label="Módulos"></nav>
<div class="velo" id="velo" hidden></div>
<main id="main"></main>
<div id="ticket"></div>
<div class="toast" id="toast" hidden></div>

<script src="../menu.js"></script>
<script>
"use strict";
// ---------- utilidades ----------
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const num = s => { const t = String(s ?? "").trim(); if (!t) return 0; const n = t.includes(",") ? t.replace(/\./g, "").replace(",", ".") : t; return parseFloat(n) || 0; };
const fmt = n => (Math.round(n * 100) / 100).toFixed(2).replace(".", ",") + " $";
const fbs = n => Math.round(n).toLocaleString("es-VE") + " Bs";
const norm = s => String(s || "").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/\s+/g, " ").trim();
const LS = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (_) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (_) { toast("No se pudo guardar en este equipo. Revisa el espacio."); } },
};
// Si el reloj de este equipo está mal, se corrige con la hora del servidor (ver ajustarReloj)
let desfase = +LS.get("pa.desfase", 0) || 0;
const ahoraReal = () => new Date(Date.now() + desfase);
function ajustarReloj(fechaServidor) {
  const t = Date.parse(fechaServidor || ""); if (isNaN(t)) return;
  const d = t - Date.now(), nuevo = Math.abs(d) > 120000 ? d : 0; // menos de 2 min: el reloj está bien
  if (Math.abs(nuevo - desfase) < 60000) return;
  desfase = nuevo; LS.set("pa.desfase", desfase); pintarReloj();
  if (desfase) toast("La hora de este equipo está mal. La caja usa la hora de Venezuela correcta.");
}
function ahoraCaracas(d = ahoraReal()) {
  const p = Object.fromEntries(new Intl.DateTimeFormat("en-CA", { timeZone: "America/Caracas", year: "numeric", month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit", hourCycle: "h23" })
    .formatToParts(d).map(x => [x.type, x.value]));
  return { fecha: `${p.year}-${p.month}-${p.day}`, hora: `${p.hour}:${p.minute}`, h: +p.hour, mmdd: p.month + p.day, hhmm: p.hour + p.minute };
}
// Hora para mostrar en am/pm (se guarda en 24 h, ej. "20:15" → "8:15 pm")
const h12 = t => { const m = String(t || "").match(/^(\d{1,2}):(\d{2})/); if (!m) return t || ""; const h = +m[1]; return `${h % 12 || 12}:${m[2]} ${h < 12 ? "am" : "pm"}`; };
// Día 6am-3pm; Noche 3pm-12am (lo que se cobre de madrugada, al cerrar, sigue siendo Noche)
const turnoDe = h => h >= 6 && h < 15 ? "Día" : "Noche";
function toast(t) { const el = $("#toast"); el.textContent = t; el.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => el.hidden = true, 3200); }
const uid = () => Math.random().toString(36).slice(2, 9);

// ---------- datos guardados en este equipo ----------

let cfg = Object.assign({ equipo: "", imprime: false, url: "", key: "", clave: "", tasa: 0, tasaAuto: true, tasaFecha: "" }, LS.get("pa.cfg", {}));
delete cfg.productos; // la lista de productos ahora sale del menú del enlace
let pedidos = LS.get("pa.pedidos", {});   // id → pedido
let dias = LS.get("pa.dias", {});         // fecha → { abrir:{}, contado:{}, gastos:[], fondo }
let cola = LS.get("pa.cola", []);         // ids por enviar a la nube
let estadoSync = LS.get("pa.sync", { ultimo: "" });
let borrador = LS.get("pa.borrador", null);
const guardarTodo = () => { LS.set("pa.pedidos", pedidos); LS.set("pa.dias", dias); LS.set("pa.cola", cola); };
// Productos para "Agregar producto" en Recibir: salen del mismo menú del enlace (antes era una lista aparte en Ajustes)
const productos = () => catsVenta().flatMap(c => filasVenta(c).map(r => { const o = opcionesVenta(r.it, r.f)[0] || { d: "", p: 0 }; return { n: nombreVenta(c, r.it), d: o.d, p: o.p, label: r.f && c.items.length > 1 ? `${r.it.name} ${r.f}` : (r.f || nombreVenta(c, r.it)) }; }));

// La conexión ya no se configura a mano ni por enlace (#cfg): era una puerta para mandar un equipo a otra base de datos.
// Si alguien abre un enlace viejo con #cfg, se borra sin usarlo.
if (/^#cfg=/.test(location.hash)) history.replaceState(null, "", location.pathname + location.search);
delete cfg.url; delete cfg.key;

// ---------- cuentas de un pedido ----------
const totalDe = p => p.devuelto ? 0 : p.items.reduce((a, i) => a + i.q * i.p, 0) + (p.delivery || 0);
const vivos = p => (p.pagos || []).filter(x => !x.anulado);
const cubiertoDe = (p, extra = []) => [...vivos(p), ...extra].reduce((a, x) => a + (x.usd || 0), 0);
const porCobrarDe = p => vivos(p).filter(x => !x.cobrado).reduce((a, x) => a + x.usd, 0);
const tasaHoy = () => num(cfg.tasa);
function refsUsadas(excluir) {
  const r = new Map();
  Object.values(pedidos).forEach(p => vivos(p).forEach(x => { if (x.forma === "Pago móvil" && x.ref && p.id !== excluir) r.set(x.ref, p.id); }));
  return r;
}

// ---------- leer el mensaje del enlace ----------
function leerPedido(t) {
  const g = re => ((t.match(re) || [])[1] || "").trim();
  const items = [];
  t.split(/\r?\n/).forEach(l => {
    const m = l.match(/^\s*[•\-*]\s*(\d+)\s*[×x]\s*(.+?)\s*·\s*([\d.,]+)\s*\$\s*$/);
    if (!m) return;
    let n = m[2], d = "";
    const dm = n.match(/^(.*?)\s*\((.*)\)$/); if (dm) { n = dm[1]; d = dm[2]; }
    const q = +m[1]; items.push({ q, n, d, p: Math.round(num(m[3]) / q * 100) / 100 });
  });
  const entrega = g(/Forma de entrega:\s*(.+)/i);
  return {
    id: g(/ID de venta:\s*(\S+)/i).replace(/[^A-Za-z0-9-]/g, "").slice(0, 40), cliente: g(/Cliente:\s*(.+)/i), telefono: g(/Tel[eé]fono:\s*(.+)/i),
    entrega: /delivery/i.test(entrega) ? "Delivery" : entrega ? "Retiro" : "", pago: g(/Forma de pago:\s*(.+)/i),
    direccion: g(/Direcci[oó]n:\s*(.+)/i), ubicacion: g(/Ubicaci[oó]n:\s*(\S+)/i), nota: g(/^Nota:\s*(.+)/im),
    items, delivery: num(g(/^Delivery:\s*([\d.,]+)\s*\$/im)),
  };
}

// ---------- pestañas ----------
let tab = LS.get("pa.tab", "nuevo");
// ?modulo=menu abre directo ese módulo (lo usa /admin/ para llevar a la app)
{ const m = new URLSearchParams(location.search).get("modulo"); if (m) { tab = m; history.replaceState(null, "", location.pathname); } }
// Módulos del menú lateral: [clave, nombre, ícono, grupo]. Para agregar un módulo, se suma aquí y en pintar().
const TABS = [
  ["vender", "Vender", "🛒", "Caja"], ["nuevo", "Recibir", "📥", "Caja"], ["cocina", "Pedidos", "🍳", "Caja"], ["banco", "Banco", "🏦", "Caja"], ["cierre", "Cierre", "📊", "Caja"], ["reportes", "Reportes", "📈", "Caja"], ["inventario", "Inventario", "📦", "Caja"],
  ["menu", "Menú del enlace", "📋", "Administración"], ["ajustes", "Ajustes", "⚙️", "Administración"],
];
if (!TABS.some(t => t[0] === tab)) tab = "nuevo";
let ultimoTab = tab === "menu" ? "nuevo" : tab; // a dónde vuelve el teléfono desde un módulo abierto aparte
function abrirLado(si) {
  $("#lado").classList.toggle("abierto", si); $("#velo").hidden = !si; $("#menuBtn").setAttribute("aria-expanded", String(si));
}
function pedidosDe(fecha) { return Object.values(pedidos).filter(p => p.fecha === fecha).sort((a, b) => a.creado - b.creado); }
function pintarTabs() {
  const hoy = ahoraCaracas().fecha, lista = pedidosDe(hoy);
  const n = { cocina: lista.filter(p => p.estado === "cocina" || p.estado === "listo").length,
    banco: lista.reduce((a, p) => a + vivos(p).filter(x => x.forma === "Pago móvil" && !x.revisado).length, 0) };
  let grupo = "";
  $("#lado").innerHTML = `<div class="marca"><img src="icono-192.png" alt="">Pa'l Antojo</div>` + TABS.map(([k, t, ico, g]) => {
    const cab = g !== grupo ? `<div class="grupo">${g}</div>` : ""; grupo = g;
    return cab + `<button data-t="${k}"${k === tab ? ` aria-current="page"` : ""}><span class="ico" aria-hidden="true">${ico}</span>${t}${n[k] ? `<span class="badge${k === "banco" ? " red" : ""}">${n[k]}</span>` : ""}</button>`;
  }).join("") + `<div class="pie"><a href="../" target="_blank" rel="noopener"><span class="ico" aria-hidden="true">🔗</span>Enlace de pedidos ↗</a><button onclick="salirApp()"><span class="ico" aria-hidden="true">🚪</span>Cerrar sesión</button></div>`;
  const actual = TABS.find(t => t[0] === tab);
  $("#titulo").textContent = actual[1];
  document.title = `${actual[1]} · Pa'l Antojo`;
}
function pintar() {
  pintarTabs();
  // Los módulos de administración son páginas aparte dentro de la app; no se recargan con cada sincronización
  const MODULOS = { menu: "../admin/?app=1" };
  $("#main").classList.toggle("modulo", !!MODULOS[tab]);
  if (MODULOS[tab] && matchMedia("(max-width: 759px)").matches) {
    // Teléfono: el módulo se abre en pantalla completa (dentro del cuadro algunos Android no lo cargan); trae "Volver a la app"
    LS.set("pa.tab", ultimoTab);
    location.href = MODULOS[tab];
    return;
  }
  if (!MODULOS[tab]) ultimoTab = tab;
  if (MODULOS[tab]) {
    if (!$("#main iframe") && !$("#main .moduloFallo")) {
      $("#main").innerHTML = `<iframe src="${MODULOS[tab]}" title="${TABS.find(t => t[0] === tab)[1]}"></iframe>`;
      // Si el teléfono no deja abrir el módulo dentro de la app (sale la hoja triste), se ofrece abrirlo aparte
      const fr = $("#main iframe"), url = MODULOS[tab];
      fr.addEventListener("load", () => {
        let bien = false;
        try { bien = !!(fr.contentDocument && fr.contentDocument.getElementById("app")); } catch (_) { }
        if (bien || !fr.isConnected) return;
        $("#main").innerHTML = `<div class="moduloFallo" style="max-width:420px;margin:40px auto;padding:0 16px;text-align:center;display:grid;gap:12px">
          <p style="margin:0;font-weight:700">Este equipo no dejó abrir el módulo dentro de la app.</p>
          <a class="btn brand" href="${url}">Abrir ${esc(TABS.find(t => t[0] === tab)[1])}</a>
          <button class="btn" type="button" id="reintentarModulo">Intentar de nuevo aquí</button>
        </div>`;
        $("#reintentarModulo").addEventListener("click", () => { $("#main").innerHTML = ""; pintar(); });
      });
    }
    document.documentElement.style.setProperty("--topH", $("#top").offsetHeight + "px");
    return;
  }
  $("#main").classList.toggle("ancho", tab === "vender" || tab === "cocina" || tab === "ajustes");
  const f = { vender: pVender, nuevo: pNuevo, cocina: pCocina, banco: pBanco, cierre: pCierre, reportes: pReportes, inventario: pInventario, ajustes: pAjustes }[tab];
  $("#main").innerHTML = f();
  if (tab === "nuevo" || tab === "vender") despuesNuevo();
  document.documentElement.style.setProperty("--topH", $("#top").offsetHeight + "px");
}
$("#lado").addEventListener("click", e => {
  const b = e.target.closest("button[data-t]"); if (!b) return;
  if (b.dataset.t !== tab) $("#main").innerHTML = "";
  tab = b.dataset.t; LS.set("pa.tab", tab); abrirLado(false); pintar(); window.scrollTo(0, 0);
});
$("#menuBtn").addEventListener("click", () => abrirLado(!$("#lado").classList.contains("abierto")));
$("#velo").addEventListener("click", () => abrirLado(false));
// ---------- Tasa BCV: se toma sola del dólar oficial; si la escriben a mano, queda la de ellos hasta tocar "Usar BCV" ----------
const TASA_API = "https://ve.dolarapi.com/v1/dolares/oficial";
function pintarTasa() {
  const inp = $("#tasaTop");
  if (document.activeElement !== inp) inp.value = cfg.tasa ? String(cfg.tasa).replace(".", ",") : "";
  const d = cfg.tasaFecha ? new Date(cfg.tasaFecha) : null;
  const fecha = d && !isNaN(d) ? d.toLocaleDateString("es-VE", { timeZone: "America/Caracas", day: "numeric", month: "short" }) : "";
  $("#tasaInfo").innerHTML = cfg.tasaAuto
    ? (fecha ? `BCV<span class="lt"> · ${esc(fecha)}</span>` : "Buscando BCV…")
    : `<span class="lt">A mano</span> <button type="button" id="tasaBcv">Usar BCV</button>`;
}
async function buscarTasa() {
  if (!cfg.tasaAuto) return;
  try {
    const r = await fetch(TASA_API, { cache: "no-store" });
    if (!r.ok) throw new Error(r.status);
    ajustarReloj(r.headers.get("Date"));
    const j = await r.json();
    const t = Math.round(Number(j.promedio ?? j.venta ?? j.compra) * 100) / 100;
    if (!(t > 0) || !cfg.tasaAuto) throw new Error("sin tasa");
    const cambio = t !== cfg.tasa;
    cfg.tasa = t; cfg.tasaFecha = j.fechaActualizacion || new Date().toISOString(); LS.set("pa.cfg", cfg);
    pintarTasa();
    if (cambio && tab === "nuevo") refrescarRevision();
  } catch (_) {
    // Sin internet o la página de la tasa no responde: se queda la última que se guardó
    if (cfg.tasaAuto && !cfg.tasaFecha) $("#tasaInfo").textContent = cfg.tasa ? "BCV sin actualizar" : "Sin BCV: escríbela";
  }
}
$("#tasaTop").addEventListener("input", e => {
  cfg.tasa = num(e.target.value); cfg.tasaAuto = false; LS.set("pa.cfg", cfg); pintarTasa();
  if (tab === "nuevo") refrescarRevision();
});
$("#tasaInfo").addEventListener("click", e => {
  if (!e.target.closest("#tasaBcv")) return;
  cfg.tasaAuto = true; cfg.tasaFecha = ""; LS.set("pa.cfg", cfg); pintarTasa(); buscarTasa();
});
// Hora actual de Venezuela en la barra de arriba, al lado de la tasa
function pintarReloj() {
  const el = $("#reloj"); if (!el) return;
  el.textContent = h12(ahoraCaracas().hora);
  el.title = desfase ? "El reloj de este equipo está mal; esta es la hora correcta de Venezuela" : "Hora de Venezuela";
  el.classList.toggle("w", !!desfase);
}
pintarReloj();
setInterval(pintarReloj, 15000);
pintarTasa();
buscarTasa();
setInterval(buscarTasa, 30 * 60 * 1000);
window.addEventListener("online", buscarTasa);

// ---------- Recibir: pegar, compartir o venta de mostrador ----------
let verAgregar = false;
let capturas = []; // URLs de imágenes solo para mirar mientras se registra (no se guardan)
function nuevoBorrador(base, modo = "nuevo") {
  const ah = ahoraCaracas();
  return { modo, pedido: base, pagos: [], merma: false, texto: "" , creado: Date.now(), hoy: ah.fecha };
}
function pedidoVacio(origen) {
  const ah = ahoraCaracas(), L = "ABCDEFGHJKLMNPQRSTUVWXYZ", r = () => L[Math.floor(Math.random() * L.length)];
  return { id: (origen === "mostrador" ? "M" : "") + `${ah.mmdd}-${ah.hhmm}-${r()}${r()}`, cliente: origen === "mostrador" ? "Cliente en el local" : "",
    telefono: "", entrega: origen === "mostrador" ? "Mostrador" : "Delivery", direccion: "", ubicacion: "", nota: "", mototaxi: "",
    items: [], delivery: 0, origen, pagos: [], estado: "cocina", rev: 0 };
}
function pagoNuevo(forma, usd) {
  const t = tasaHoy();
  return { id: uid(), forma, ref: "", banco: "", bs: forma === "Pago móvil" || forma === "Efectivo Bs" ? (t ? Math.round(usd * t * 100) / 100 : "") : "",
    usdIn: forma === "Efectivo $" || forma === "Devolución" ? Math.round(usd * 100) / 100 : "", cobrado: forma !== "Efectivo $" && forma !== "Efectivo Bs", visto: false, medio: "Pago móvil" };
}
function usdDe(x) {
  if (x.forma === "Efectivo $") return num(x.usdIn);
  if (x.forma === "Devolución") return -num(x.usdIn);
  const t = tasaHoy(); return t ? num(x.bs) / t : 0;
}
function guardarBorrador() { LS.set("pa.borrador", borrador); }

function pNuevo() {
  if (!borrador) return `
    <section class="drop" id="drop">
      <h2>Recibir un pedido pagado</h2>
      <p class="hint">Desde el teléfono: en WhatsApp toca el pedido y el capture, Compartir y "Caja Pa'l Antojo". En la PC con WhatsApp Web: copia el mensaje del pedido y pégalo aquí (Ctrl+V). El capture también se puede pegar o arrastrar.</p>
      <label for="pegar">Mensaje del pedido</label>
      <textarea id="pegar" rows="5" placeholder="Pega aquí el mensaje que llegó por WhatsApp (empieza con 'ID de venta')"></textarea>
      <div class="acts"><button class="btn brand big" data-a="leer">Leer pedido</button>
      <button class="btn ghost" data-a="mostrador">+ Venta de mostrador</button></div>
    </section>
    ${!tasaHoy() ? `<p class="msg w">Falta la tasa del día arriba. Sin ella no se pueden revisar los pagos en Bs.</p>` : ""}`;
  return editorHTML();

  inv.insumos.forEach(x => { const m = lista.find(m => m.ins === x.id); desde[x.id] = m ? m.t - 1 : Infinity; });
  lista.forEach(m => { if (m.tipo === "conteo") { hay[m.ins] = num(m.c); desde[m.ins] = m.t; } });

    if (modoSync === "v2") await enviarV2(H); else await enviarConClave(H);
    pintarSync(); msg("Conectado" + (modoSync === "v2" ? " con tu usuario." : "."));
  } catch (err) {
    if (err.sesion) { avisoSesion = "Vuelve a entrar para sincronizar"; pintarSync(); msg("La sesión venció o este usuario no tiene permiso. Vuelve a entrar."); }
    else { pintarSync("No se pudo sincronizar", "bad"); msg("Error: " + err.message); }
  } finally { sincronizando = false; }
}
function avisar() {
  try { const c = new (window.AudioContext || window.webkitAudioContext)(), o = c.createOscillator(), g = c.createGain(); o.frequency.value = 880; o.connect(g); g.connect(c.destination); g.gain.setValueAtTime(.2, c.currentTime); g.gain.exponentialRampToValueAtTime(.001, c.currentTime + .6); o.start(); o.stop(c.currentTime + .6); } catch (_) { }
}
window.addEventListener("online", () => sincronizar());
window.addEventListener("offline", () => pintarSync());
setInterval(sincronizar, 5000);

// ---------- pegar y arrastrar (PC con WhatsApp Web) ----------
function agregarImagen(file) { if (!file || !file.type.startsWith("image/")) return false; capturas.push(URL.createObjectURL(file)); return true; }
document.addEventListener("paste", e => {
  if (tab !== "nuevo") return;
  const items = [...(e.clipboardData?.items || [])];
  const img = items.find(i => i.type.startsWith("image/"));
  if (img) { e.preventDefault(); agregarImagen(img.getAsFile()); pintar(); toast("Capture agregado."); return; }
  const t = e.clipboardData?.getData("text/plain") || "";
  if (!borrador && /ID de venta|PEDIDO/i.test(t) && e.target.id !== "pegar") { e.preventDefault(); leerTexto(t); }
  else if (!borrador && e.target.id === "pegar" && /ID de venta|PEDIDO/i.test(t)) { setTimeout(() => leerTexto($("#pegar").value), 0); }
});
document.addEventListener("dragover", e => { if (tab === "nuevo") { e.preventDefault(); $("#drop")?.classList.add("over"); } });
document.addEventListener("dragleave", () => $("#drop")?.classList.remove("over"));
document.addEventListener("drop", e => {
  if (tab !== "nuevo") return; e.preventDefault(); $("#drop")?.classList.remove("over");
  const files = [...(e.dataTransfer?.files || [])]; let n = 0; files.forEach(f => { if (agregarImagen(f)) n++; });
  const t = e.dataTransfer?.getData("text/plain");
  if (t && !borrador) leerTexto(t); else if (n) pintar();
});

// ---------- lo que llega por Compartir (teléfono Android) ----------
function abrirDB() {
  return new Promise((ok, mal) => { const r = indexedDB.open("pa-compartidos", 1); r.onupgradeneeded = () => r.result.createObjectStore("items", { keyPath: "t" }); r.onsuccess = () => ok(r.result); r.onerror = () => mal(r.error); });
}
async function leerCompartidos() {
  // Lo compartido se queda guardado hasta que el pedido se guarda o se descarta, porque cada Compartir vuelve a abrir la app
  try {
    const db = await abrirDB();
    const todos = await new Promise(ok => { const q = db.transaction("items").objectStore("items").getAll(); q.onsuccess = () => ok(q.result || []); q.onerror = () => ok([]); });
    const recientes = todos.filter(x => Date.now() - x.t < 30 * 60e3);
    if (!recientes.length) return;
    capturas = [];
    recientes.forEach(x => (x.files || []).forEach(agregarImagen));
    const nuevos = recientes.filter(x => x.text && !x.usado);
    const texto = nuevos.map(x => x.text).join("\n");
    if (nuevos.length) await new Promise(ok => { const tx = db.transaction("items", "readwrite"); nuevos.forEach(x => tx.objectStore("items").put({ ...x, usado: true })); tx.oncomplete = ok; tx.onerror = ok; });
    tab = "nuevo"; LS.set("pa.tab", tab);
    if (texto.trim() && !borrador) leerTexto(texto);
    else { pintar(); if (!texto.trim()) toast(borrador ? "Capture agregado al pedido." : "Llegó el capture. Ahora comparte el mensaje del pedido."); }
  } catch (_) { }
}
async function limpiarCompartidos() {
  try { const db = await abrirDB(); const tx = db.transaction("items", "readwrite"); tx.objectStore("items").clear(); } catch (_) { }
}

// ---------- arranque ----------
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => { });
// Pide al navegador que no borre los datos de este equipo cuando le falte espacio
try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch (_) { }
pintar(); pintarSync();
if (new URLSearchParams(location.search).has("compartido")) { history.replaceState(null, "", location.pathname); }
leerCompartidos();
document.addEventListener("visibilitychange", () => { if (!document.hidden) { leerCompartidos(); sincronizar(); } });
sincronizar();

function ayudaDe(el) {
  if (el.dataset.ayuda) return el.dataset.ayuda;
  if (el.id && AYUDA["id:" + el.id]) return AYUDA["id:" + el.id];
  if (el.dataset.f && AYUDA["f:" + el.dataset.f]) return AYUDA["f:" + el.dataset.f];
  for (const k of ["a", "v", "iv", "rep"]) if (el.dataset[k] && AYUDA[k + ":" + el.dataset[k]]) return AYUDA[k + ":" + el.dataset[k]];
  return "";
}
const SEL_AYUDA = "button[data-a], button[data-v], button[data-iv], button[data-rep], button[data-ayuda], #tasaBcv";
const globo = document.createElement("div"); globo.id = "globo"; globo.setAttribute("role", "tooltip"); globo.hidden = true; document.body.appendChild(globo);
function mostrarGlobo(el) {
  const t = ayudaDe(el); if (!t) return false;
  globo.textContent = t; globo.hidden = false;
  const r = el.getBoundingClientRect(), g = globo.getBoundingClientRect();
  const x = Math.min(Math.max(8, r.left + r.width / 2 - g.width / 2), innerWidth - g.width - 8);
  const arriba = r.top - g.height - 8;
  globo.style.left = x + "px"; globo.style.top = (arriba > 8 ? arriba : r.bottom + 8) + "px";
  return true;
}
const ocultarGlobo = () => { globo.hidden = true; clearTimeout(ocultarGlobo.t); };
// PC: al pasar el ratón medio segundo
let tGlobo;
document.addEventListener("mouseover", e => {
  const el = e.target.closest && e.target.closest(SEL_AYUDA); clearTimeout(tGlobo);
  if (!el) return ocultarGlobo();
  tGlobo = setTimeout(() => mostrarGlobo(el), 500);
});
document.addEventListener("mousedown", () => { clearTimeout(tGlobo); ocultarGlobo(); });
// Teléfono: dejar el dedo presionado. Si sale la ayuda, ese toque no ejecuta el botón.
let tToque, ayudaVista = false;
document.addEventListener("touchstart", e => {
  const el = e.target.closest && e.target.closest(SEL_AYUDA); ayudaVista = false; clearTimeout(tToque); ocultarGlobo();
  if (el) tToque = setTimeout(() => { ayudaVista = mostrarGlobo(el); if (ayudaVista && navigator.vibrate) navigator.vibrate(15); }, 450);
}, { passive: true });
document.addEventListener("touchmove", () => clearTimeout(tToque), { passive: true });
document.addEventListener("touchend", e => {
  clearTimeout(tToque);
  if (ayudaVista) { e.preventDefault(); ocultarGlobo.t = setTimeout(() => globo.hidden = true, 2600); }
});
document.addEventListener("contextmenu", e => { if (e.target.closest && e.target.closest(SEL_AYUDA)) e.preventDefault(); });
addEventListener("scroll", ocultarGlobo, { passive: true });
// Una sola vez por equipo: avisar que existe la ayuda
if (!LS.get("pa.ayudaVista", false)) setTimeout(() => {
  toast(matchMedia("(pointer: coarse)").matches ? "Consejo: deja el dedo presionado sobre un botón para ver qué hace." : "Consejo: pasa el ratón sobre un botón para ver qué hace.");
  LS.set("pa.ayudaVista", true);
}, 1500);
