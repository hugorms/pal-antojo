<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pa'l Antojo App</title>
<meta name="theme-color" content="#1A1A1A">
<link rel="manifest" href="manifest.webmanifest">

<style>
/* Caja de la tienda: barra arriba con tasa y estado, pestañas, y un panel por pestaña. Una columna en teléfono. */
:root {
  --brand: #F2B705; --ink: #1A1A1A; --bg: #FBF8EF; --surface: #FFFFFF; --line: #E6E0CF; --muted: #6B6B6B;
  --ok: #1F7A3A; --okbg: #E5F4E4; --bad: #B3261E; --badbg: #FBEBEB; --warnbg: #FFF4D1;
  --fg: var(--ink); --onbrand: #1A1A1A;
  --display: "Fredoka", "Trebuchet MS", system-ui, sans-serif;
  --body: "Nunito", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) { :root {
  --bg: #151410; --surface: #201E18; --line: #38342A; --fg: #F3EEE0; --muted: #A8A291;
  --ok: #6FCF8A; --okbg: #1B3324; --bad: #F08A82; --badbg: #3A1E1C; --warnbg: #3A3115; color-scheme: dark } }
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--fg); font: 15px/1.45 var(--body); padding-bottom: env(safe-area-inset-bottom, 0px); }
h1, h2, h3 { font-family: var(--display); margin: 0; line-height: 1.15; }
h2 { font-size: 1.25rem; } h3 { font-size: 1.02rem; }
p { margin: 0; }
[hidden] { display: none !important; }
.top { position: sticky; top: 0; z-index: 3; background: var(--ink); color: #F3EEE0; padding: calc(8px + env(safe-area-inset-top, 0px)) max(14px, env(safe-area-inset-right, 0px)) 8px max(14px, env(safe-area-inset-left, 0px)); display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; justify-content: space-between; }
.top h1 { color: var(--brand); font-size: 1.15rem; }
.top .r { display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: center; font-size: .85rem; }
.top label { display: flex; align-items: center; gap: 6px; color: #F3EEE0; font-weight: 700; }
.top .tinfo { font-size: .78rem; color: #CFC8B4; display: flex; gap: 6px; align-items: center; }
.top .tinfo button { padding: 2px 8px; font-size: .78rem; background: var(--brand); color: var(--ink); border: 0; font-weight: 700; cursor: pointer; }
.top input { width: 90px; padding: 4px 8px; background: #2A2822; color: #F3EEE0; border: 1px solid #4A463A; }
.dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; background: #888; margin-right: 5px; }
.dot.ok { background: #6FCF8A; } .dot.w { background: var(--brand); } .dot.bad { background: #F08A82; }
.top .menuBtn { background: none; border: 0; color: var(--brand); font-size: 1.5rem; line-height: 1; padding: 2px 6px 4px 0; cursor: pointer; }
.top .izq { display: flex; align-items: center; gap: 4px; }
/* Menú lateral: fijo en PC, cajón que se abre con ☰ en el teléfono. Cada módulo es una entrada. */
.lado { position: fixed; z-index: 5; top: 0; bottom: 0; left: 0; width: 240px; background: var(--surface); border-right: 1px solid var(--line);
  padding: calc(14px + env(safe-area-inset-top, 0px)) 10px 14px max(10px, env(safe-area-inset-left, 0px)); overflow-y: auto; display: flex; flex-direction: column; gap: 2px;
  transform: translateX(-100%); transition: transform .2s; }
.lado.abierto { transform: none; box-shadow: 0 0 40px rgba(0,0,0,.35); }
.lado .marca { display: flex; align-items: center; gap: 10px; padding: 0 6px 12px; font: 700 1.1rem var(--display); }
.lado .marca img { width: 36px; height: 36px; border-radius: 50%; }
.lado .grupo { font: 800 .7rem var(--body); letter-spacing: .07em; text-transform: uppercase; color: var(--muted); padding: 12px 10px 4px; }
.lado button, .lado a { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; background: transparent; border: 0; border-radius: 10px;
  padding: 9px 10px; font: 800 .95rem var(--body); color: var(--fg); cursor: pointer; text-decoration: none; }
.lado button:hover, .lado a:hover { background: var(--warnbg); }
.lado button[aria-current="page"] { background: var(--brand); color: var(--onbrand); }
.lado .ico { width: 22px; text-align: center; }
.lado .pie { margin-top: auto; padding-top: 12px; }
.velo { position: fixed; inset: 0; z-index: 4; background: rgba(0,0,0,.35); }
@media (min-width: 900px) {
  .lado { transform: none; transition: none; }
  .lado.abierto { box-shadow: none; }
  .velo, .top .menuBtn { display: none; }
  body { padding-left: 240px; }
}
/* Vender: productos a la izquierda, factura a la derecha (abajo en el teléfono) */
main.ancho { max-width: 1200px; }
.vender { display: grid; gap: 14px; align-items: start; }
@media (min-width: 760px) { .vender { grid-template-columns: minmax(0, 1fr) 340px; } .vfac { position: sticky; top: calc(var(--topH, 48px) + 12px); } .vpie { display: none !important; } }
.vbar { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
.vgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; }
.vcard { display: grid; gap: 0; padding: 0; overflow: hidden; border: 1.5px solid var(--line); border-radius: 16px; background: var(--surface); color: var(--fg); cursor: pointer; text-align: left; }
.vcard b { font: 600 1.05rem var(--display); padding: 8px 10px 10px; }
.vph { position: relative; overflow: hidden; display: grid; place-items: center; aspect-ratio: 4 / 3; font-size: 2.6rem; background: radial-gradient(circle at 30% 25%, #FFD54A, var(--brand) 70%); }
.vph img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.vph.mini { width: 56px; aspect-ratio: 1; border-radius: 10px; font-size: 1.6rem; grid-row: span 3; }
.vprods, .vopts, .vformas { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
.vprod { display: grid; grid-template-columns: auto 1fr; column-gap: 10px; align-content: start; text-align: left; padding: 12px; min-height: 72px; border: 1.5px solid var(--line); border-radius: 14px; background: var(--surface); color: var(--fg); cursor: pointer; font: inherit; }
.vprod > b, .vprod > small, .vprod > .vp { grid-column: 2; }
.vprod:not(:has(.vph)) > * { grid-column: 1 / -1; }
.vprod b { font-weight: 800; font-size: 1rem; }
.vprod small { color: var(--muted); font-size: .8rem; }
.vprod .vp { font: 700 1rem var(--display); margin-top: 4px; }
.vprod:active, .vcard:active { transform: scale(.97); border-color: var(--brand); }
.vprod.agot { opacity: .45; }
.velegir { border-color: var(--brand); box-shadow: 0 0 0 2px var(--brand); margin-bottom: 10px; }
.velegir small { color: var(--muted); font: 700 .85rem var(--body); }
.vfac h2 { margin-bottom: 4px; }
.vlin { display: grid; gap: 6px; }
.vl { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 10px; align-items: center; font-variant-numeric: tabular-nums; }
.vl .nm small { display: block; color: var(--muted); }
.vq { display: inline-flex; align-items: center; gap: 6px; }
.vq button { width: 34px; height: 34px; border-radius: 50%; border: 2px solid var(--fg); background: var(--surface); color: var(--fg); font: 800 1.1rem var(--body); cursor: pointer; }
.vq b { min-width: 18px; text-align: center; }
.vtot { display: flex; justify-content: space-between; align-items: baseline; border-top: 2px dashed var(--line); padding-top: 8px; font: 700 1.4rem var(--display); }
.vtot small, .vbig small, .vvuelto small { display: block; font: 700 .85rem var(--body); color: var(--muted); text-align: right; }
.vcobrar { width: 100%; font-size: 1.15rem; padding: 14px; }
.vpie { position: sticky; bottom: 0; display: flex; justify-content: space-between; align-items: center; gap: 10px; background: var(--surface); border-top: 1px solid var(--line); margin: 0 -14px -40px; padding: 10px 14px calc(10px + env(safe-area-inset-bottom, 0px)); font-size: 1.05rem; }
.vbig { background: var(--ink); color: var(--brand); border-radius: 16px; padding: 14px 16px; display: grid; gap: 2px; margin-bottom: 12px; }
.vbig span { color: #F3EEE0; font-weight: 700; }
.vbig b { font: 700 2.4rem var(--display); line-height: 1.1; }
.vbig small { text-align: left; color: #F3EEE0; font-size: 1rem; }
.vbig small.bad { color: #F08A82; }
.cobrar h3 { margin: 4px 0 8px; }
.vformas { margin-bottom: 10px; }
.vformas .vprod { min-height: 56px; align-content: center; }
.vpago { margin-bottom: 10px; }
.vmonto { font-size: 1.3rem !important; max-width: 200px; }
.vfalta { font: 700 1.2rem var(--display); color: var(--bad); }
.vvuelto { background: var(--okbg); color: var(--ok); border-radius: 14px; padding: 10px 14px; font: 700 1.2rem var(--display); display: flex; justify-content: space-between; align-items: baseline; gap: 10px; margin: 8px 0; }
.vvuelto b { font-size: 1.8rem; }
#vestado { display: grid; gap: 6px; margin: 6px 0 12px; }
.vlisto { max-width: 460px; margin: 30px auto; text-align: center; justify-items: center; }
.vok { width: 72px; height: 72px; border-radius: 50%; background: var(--okbg); color: var(--ok); display: grid; place-items: center; font-size: 2.4rem; font-weight: 800; }
main.modulo { max-width: none; padding: 0; display: block; }
main.modulo iframe { display: block; width: 100%; height: calc(100vh - var(--topH, 48px)); height: calc(100dvh - var(--topH, 48px)); border: 0; }
.badge { display: inline-grid; place-items: center; min-width: 20px; height: 20px; padding: 0 5px; margin-left: 4px; border-radius: 999px; background: var(--fg); color: var(--surface); font: 800 .72rem var(--body); }
.badge.red { background: var(--bad); color: #fff; }
main { max-width: 900px; margin: 0 auto; padding: 14px max(14px, env(safe-area-inset-right, 0px)) 40px max(14px, env(safe-area-inset-left, 0px)); display: grid; gap: 14px; }
.hint, .note { color: var(--muted); font-size: .88rem; }
.card { border: 1.5px solid var(--line); border-radius: 14px; padding: 12px; display: grid; gap: 8px; background: var(--surface); min-width: 0; }
.card.new { animation: pop .7s ease; }
@keyframes pop { from { background: var(--warnbg); } }
.oh { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 4px 10px; align-items: baseline; }
.id { font: 700 1rem var(--display); font-variant-numeric: tabular-nums; }
.meta { color: var(--muted); font-size: .85rem; }
.pill { font: 800 .7rem var(--body); text-transform: uppercase; letter-spacing: .05em; border-radius: 6px; padding: 2px 7px; background: var(--line); white-space: nowrap; }
.pill.w { background: var(--warnbg); } .pill.g { background: var(--okbg); color: var(--ok); } .pill.r { background: var(--badbg); color: var(--bad); }
.lines { display: grid; gap: 3px; font-variant-numeric: tabular-nums; }
.ln { display: grid; grid-template-columns: auto minmax(0, 1fr) auto auto; gap: 8px; align-items: center; }
.ln .nm { min-width: 0; overflow-wrap: anywhere; }
.ln .nm small { color: var(--muted); display: block; }
.tot { display: flex; justify-content: space-between; font: 700 1.05rem var(--display); border-top: 1px dashed var(--line); padding-top: 6px; font-variant-numeric: tabular-nums; }
.acts { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.btn { border: 2px solid var(--fg); background: var(--fg); color: var(--surface); border-radius: 10px; padding: 8px 12px; font: 800 .9rem var(--body); cursor: pointer; }
.btn.brand { background: var(--brand); border-color: var(--brand); color: var(--onbrand); }
.btn.ghost { background: transparent; color: var(--fg); }
.btn.link { border: 0; background: none; color: var(--bad); padding: 8px 4px; }
.btn.big { padding: 12px 16px; font-size: 1rem; }
.btn:disabled { opacity: .4; cursor: not-allowed; }
.q { display: inline-flex; align-items: center; gap: 6px; }
.q button { width: 28px; height: 28px; border-radius: 50%; border: 1.5px solid var(--fg); background: transparent; color: var(--fg); font: 700 1rem var(--body); cursor: pointer; line-height: 1; }
.q span { min-width: 1.3em; text-align: center; font-weight: 800; }
.x { border: 0; background: none; color: var(--bad); font: 800 1rem var(--body); cursor: pointer; padding: 2px 6px; }
button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 3px solid var(--brand); outline-offset: 2px; }
label { display: grid; gap: 3px; font-size: .8rem; font-weight: 700; color: var(--muted); }
input, select, textarea { font: 700 .95rem var(--body); color: var(--fg); background: var(--surface); border: 1.5px solid var(--line); border-radius: 8px; padding: 7px 9px; min-width: 0; width: 100%; }
textarea { font-weight: 600; resize: vertical; }
.fields { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 8px; }
/* Inventario: filas que no cortan los nombres. En teléfono el nombre va solo en su línea. */
.irow { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) auto; gap: 8px; align-items: end; padding: 10px 0; border-top: 1px solid var(--line); }
.irow:first-of-type { border-top: 0; padding-top: 2px; }
.irow .ancho { grid-column: 1 / -1; }
.irow .x { align-self: center; padding: 8px 6px; }
.ucant { display: flex; align-items: center; gap: 6px; }
.ucant span { color: var(--muted); font-weight: 700; font-size: .85rem; white-space: nowrap; }
.mov { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 10px; padding: 9px 0; border-top: 1px solid var(--line); align-items: center; }
.mov:first-child { border-top: 0; }
.mov b { font-weight: 800; } .mov .mq { font-weight: 800; white-space: nowrap; display: flex; flex-direction: column; align-items: flex-end; }
/* Agregar con foto de factura */
.fotos { display: flex; flex-wrap: wrap; gap: 8px; margin: 8px 0; }
.fotos div { position: relative; }
.fotos img { width: 72px; height: 96px; object-fit: cover; border-radius: 8px; border: 1.5px solid var(--line); display: block; }
.fotos .x { position: absolute; top: -8px; right: -8px; background: var(--surface); border-radius: 50%; width: 26px; height: 26px; padding: 0; border: 1.5px solid var(--line); }
.subir { position: relative; overflow: hidden; }
.subir input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
.fline { padding: 10px 0; border-top: 1px solid var(--line); display: grid; gap: 6px; }
.fline:first-of-type { border-top: 0; }
.fline.fuera { opacity: .5; }
.fline .meta { font-size: .85rem; }
@media (max-width: 639px) { .fields .ancho { grid-column: 1 / -1; } }
@media (min-width: 640px) {
  .irow { grid-template-columns: minmax(0, 2fr) minmax(0, 1fr) auto; }
  .irow.c4 { grid-template-columns: minmax(0, 2fr) 110px minmax(0, 1fr) auto; }
  .irow .ancho { grid-column: auto; }
}
.chk { display: flex; gap: 8px; align-items: center; font-size: .9rem; color: var(--fg); font-weight: 700; }
.chk input { width: 18px; height: 18px; flex: none; }
.msg { font-size: .88rem; font-weight: 700; border-radius: 8px; padding: 7px 10px; }
.msg.ok { background: var(--okbg); color: var(--ok); } .msg.bad { background: var(--badbg); color: var(--bad); } .msg.w { background: var(--warnbg); }
.empty { text-align: center; color: var(--muted); padding: 22px 10px; border: 1.5px dashed var(--line); border-radius: 12px; }
.drop { border: 2px dashed var(--line); border-radius: 14px; padding: 14px; display: grid; gap: 10px; background: var(--surface); }
.drop.over { border-color: var(--brand); background: var(--warnbg); }
.shot { max-width: 220px; max-height: 320px; border-radius: 10px; border: 1px solid var(--line); object-fit: contain; }
.shots { display: flex; flex-wrap: wrap; gap: 8px; align-items: flex-start; }
.pago { border: 1.5px solid var(--line); border-radius: 12px; padding: 10px; display: grid; gap: 8px; background: var(--bg); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.seg button[aria-pressed="true"], .vprod[aria-pressed="true"] { border-color: var(--fg); box-shadow: inset 0 0 0 1.5px var(--fg); }
.chips button { border: 1.5px solid var(--line); background: var(--surface); color: var(--fg); border-radius: 999px; padding: 4px 10px; font: 700 .82rem var(--body); cursor: pointer; }
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; }
.kpi { border: 1.5px solid var(--line); border-radius: 12px; padding: 10px; display: grid; gap: 2px; background: var(--surface); }
.kpi small { color: var(--muted); font-weight: 700; font-size: .8rem; }
.kpi b { font: 700 1.3rem var(--display); font-variant-numeric: tabular-nums; }
.kpi.main { background: var(--brand); border-color: var(--brand); color: var(--onbrand); }
.kpi.main small { color: var(--onbrand); }
.tbl { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: .9rem; font-variant-numeric: tabular-nums; }
th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); vertical-align: middle; }
th { font-size: .74rem; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); }
td.n, th.n { text-align: right; }
td input { width: 80px; padding: 4px 6px; }
.low { color: var(--bad); font-weight: 800; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); background: var(--fg); color: var(--surface); padding: 10px 16px; border-radius: 12px; font-weight: 800; font-size: .9rem; max-width: calc(100% - 32px); z-index: 9; }
details summary { cursor: pointer; font-weight: 800; }
#ticket { display: none; }
@media print {
  @page { size: 58mm auto; margin: 2mm; }
  body { background: #fff; color: #000; }
  body > *:not(#ticket) { display: none !important; }
  #ticket { display: block; width: 54mm; font: 11px/1.3 "Courier New", monospace; color: #000; }
  #ticket .t { text-align: center; font-weight: bold; font-size: 14px; }
  #ticket .row { display: flex; justify-content: space-between; gap: 4px; }
  #ticket hr { border: 0; border-top: 1px dashed #000; margin: 4px 0; }
  #ticket .big { font-size: 13px; font-weight: bold; text-align: center; border: 2px solid #000; padding: 3px; margin-top: 4px; }
  #ticket .tk { page-break-after: always; }
}
@media (prefers-reduced-motion: reduce) { .card.new { animation: none; } }
</style>

<body>
<header class="top" id="top">
  <div class="izq"><button class="menuBtn" id="menuBtn" aria-label="Abrir el menú" aria-controls="lado" aria-expanded="false">☰</button><h1 id="titulo">Caja Pa'l Antojo</h1></div>
  <div class="r">
    <label for="tasaTop">Tasa Bs/$ <input id="tasaTop" inputmode="decimal" placeholder="Ej. 230"></label>
    <span id="tasaInfo" class="tinfo"></span>
    <span id="syncTxt"><span class="dot"></span>…</span>
  </div>
</header>
<nav class="lado" id="lado" aria-label="Módulos"></nav>
<div class="velo" id="velo" hidden></div>
<main id="main"></main>
<div id="ticket"></div>
<div class="toast" id="toast" hidden></div>

<script src="../menu.js"></script>
<script>
"use strict";
// ---------- utilidades ----------
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const num = s => { const t = String(s ?? "").trim(); if (!t) return 0; const n = t.includes(",") ? t.replace(/\./g, "").replace(",", ".") : t; return parseFloat(n) || 0; };
const fmt = n => (Math.round(n * 100) / 100).toFixed(2).replace(".", ",") + " $";
const fbs = n => Math.round(n).toLocaleString("es-VE") + " Bs";
const norm = s => String(s || "").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/\s+/g, " ").trim();
const LS = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (_) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (_) { toast("No se pudo guardar en este equipo. Revisa el espacio."); } },
};
function ahoraCaracas(d = new Date()) {
  const p = Object.fromEntries(new Intl.DateTimeFormat("en-CA", { timeZone: "America/Caracas", year: "numeric", month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit", hourCycle: "h23" })
    .formatToParts(d).map(x => [x.type, x.value]));
  return { fecha: `${p.year}-${p.month}-${p.day}`, hora: `${p.hour}:${p.minute}`, h: +p.hour, mmdd: p.month + p.day, hhmm: p.hour + p.minute };
}
const turnoDe = h => h < 15 ? "Día" : "Noche";
function toast(t) { const el = $("#toast"); el.textContent = t; el.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => el.hidden = true, 3200); }
const uid = () => Math.random().toString(36).slice(2, 9);

// ---------- datos guardados en este equipo ----------
const PRODUCTOS_BASE = `Empanada de queso | 1,5 | sí
Empanada de dominó | 1,5 | sí
Empanada de pollo | 1,5 | sí
Empanada de carne mechada | 1,5 | sí
Empanada de pabellón | 1,5 | sí
Empanada de jamón y queso | 1,75 | sí
Empanada de carne molida | 2 | sí
Empanada de chicharrón | 2 | sí
Empanada de pizza | 2 | sí
Empanada de cazón | 2 | sí
Papa rellena de carne | 2,25 | sí

// ---------- leer el mensaje del enlace ----------
function leerPedido(t) {
  const g = re => ((t.match(re) || [])[1] || "").trim();
  const items = [];
  t.split(/\r?\n/).forEach(l => {
    const m = l.match(/^\s*[•\-*]\s*(\d+)\s*[×x]\s*(.+?)\s*·\s*([\d.,]+)\s*\$\s*$/);
    if (!m) return;
    let n = m[2], d = "";
    const dm = n.match(/^(.*?)\s*\((.*)\)$/); if (dm) { n = dm[1]; d = dm[2]; }
    const q = +m[1]; items.push({ q, n, d, p: Math.round(num(m[3]) / q * 100) / 100 });
  });
  const entrega = g(/Forma de entrega:\s*(.+)/i);
  return {
    id: g(/ID de venta:\s*(\S+)/i), cliente: g(/Cliente:\s*(.+)/i), telefono: g(/Tel[eé]fono:\s*(.+)/i),
    entrega: /delivery/i.test(entrega) ? "Delivery" : entrega ? "Retiro" : "", pago: g(/Forma de pago:\s*(.+)/i),
    direccion: g(/Direcci[oó]n:\s*(.+)/i), ubicacion: g(/Ubicaci[oó]n:\s*(\S+)/i), nota: g(/^Nota:\s*(.+)/im),
    items, delivery: num(g(/^Delivery:\s*([\d.,]+)\s*\$/im)),
  };
}

const TASA_API = "https://ve.dolarapi.com/v1/dolares/oficial";
function pintarTasa() {
  const inp = $("#tasaTop");
  if (document.activeElement !== inp) inp.value = cfg.tasa ? String(cfg.tasa).replace(".", ",") : "";
  const d = cfg.tasaFecha ? new Date(cfg.tasaFecha) : null;
  const fecha = d && !isNaN(d) ? d.toLocaleDateString("es-VE", { timeZone: "America/Caracas", day: "numeric", month: "short" }) : "";
  $("#tasaInfo").innerHTML = cfg.tasaAuto
    ? (fecha ? `BCV · ${esc(fecha)}` : "Buscando BCV…")
    : `A mano <button type="button" id="tasaBcv">Usar BCV</button>`;
}
async function buscarTasa() {
  if (!cfg.tasaAuto) return;
  try {
    const r = await fetch(TASA_API, { cache: "no-store" });
    if (!r.ok) throw new Error(r.status);
    const j = await r.json();
    const t = Math.round(Number(j.promedio ?? j.venta ?? j.compra) * 100) / 100;
    if (!(t > 0) || !cfg.tasaAuto) throw new Error("sin tasa");
    const cambio = t !== cfg.tasa;
    cfg.tasa = t; cfg.tasaFecha = j.fechaActualizacion || new Date().toISOString(); LS.set("pa.cfg", cfg);
    pintarTasa();
    if (cambio && tab === "nuevo") refrescarRevision();
  } catch (_) {
    // Sin internet o la página de la tasa no responde: se queda la última que se guardó
    if (cfg.tasaAuto && !cfg.tasaFecha) $("#tasaInfo").textContent = cfg.tasa ? "BCV sin actualizar" : "Sin BCV: escríbela";
  }
}

function revisar() {
  const b = borrador, p = b.pedido, existe = !!pedidos[p.id] && b.modo !== "nuevo";
  const errores = [], avisos = [];
  if (!p.items.length && b.modo !== "devolver") errores.push("Agrega al menos un producto.");
  if (!p.cliente.trim()) errores.push("Falta el nombre del cliente.");
  if (!existe && pedidos[p.id]) errores.push(`El pedido ${p.id} ya está en la caja. Ábrelo desde Pedidos para cambiarlo.`);
  const usadas = refsUsadas(p.id), vistas = new Set();
  const enBs = b.pagos.some(x => x.forma === "Pago móvil" || x.forma === "Efectivo Bs");
  if (enBs && !tasaHoy()) errores.push("Pon la tasa del día arriba para pasar los Bs a dólares.");
  b.pagos.forEach(x => {
    if (x.forma === "Pago móvil") {
      if (!/^\d{6}$/.test(x.ref)) errores.push("Escribe los últimos 6 dígitos de la referencia.");
      else if (usadas.has(x.ref)) errores.push(`La referencia ${x.ref} ya se usó en el pedido ${usadas.get(x.ref)}. Puede ser un capture reenviado.`);
      else if (vistas.has(x.ref)) errores.push(`La referencia ${x.ref} está repetida en este pedido.`);
      vistas.add(x.ref);
      if (!num(x.bs)) errores.push("Falta el monto del pago móvil en Bs.");
      if (!x.visto) errores.push("Marca \"Ya lo vi en el banco\" cuando el pago aparezca en tu banco.");
    } else if (!usdDe(x)) errores.push(`Falta el monto de ${x.forma.toLowerCase()}.`);
  });
  const tot = b.modo === "devolver" ? 0 : totalDe(p);
  const base = b.modo === "devolver" ? vivos(p).filter(x => x.cobrado) : vivos(p);
  const cub = base.reduce((a, x) => a + x.usd, 0) + b.pagos.reduce((a, x) => a + usdDe(x), 0);
  const falta = tot - cub, tol = Math.max(0.02, tot * 0.01);
  let estado;
  if (falta > tol) { estado = `<p class="msg bad">Faltan ${fmt(falta)}${tasaHoy() ? ` (${fbs(falta * tasaHoy())})` : ""}. Agrega el pago que falta.</p>`; errores.push(""); }
  else if (falta < -tol) { estado = `<p class="msg w">Hay ${fmt(-falta)} de más. ${b.modo === "devolver" ? "" : "Si el cliente pagó de más, registra la devolución o dale el vuelto."}</p>`; if (b.modo === "devolver") errores.push(""); }
  else estado = `<p class="msg ok">${b.modo === "devolver" ? "Devolución completa." : "Cubierto."}${porCobrarSim(p, b) > 0.01 ? ` El ticket sale con COBRAR ${fmt(porCobrarSim(p, b))}.` : ""}</p>`;

// ---------- Inventario: ingredientes, preparaciones y recetas ----------
// Cada producto vendido descuenta sus ingredientes. Lo que hay = último conteo + compras − mermas − lo vendido desde ese conteo.
// Si dos productos usan la misma carne, al vender uno baja lo que alcanza para los dos.
const UNIDADES = ["g", "kg", "ml", "L", "unidad"];
let inv = Object.assign({ insumos: [], preps: [], recetas: {}, rev: 0 }, LS.get("pa.inv", {}));
let movs = LS.get("pa.movs", {}); // id → { id, ins, tipo: entrada|conteo|merma, c, t, nota, quien, anulado }
let invVista = LS.get("pa.invVista", "hay"), invSel = "";
const cant = n => (Math.round(n * 100) / 100).toLocaleString("es-VE", { maximumFractionDigits: 2 });
const insumoDe = id => inv.insumos.find(x => x.id === id);
const prepDe = id => inv.preps.find(x => x.id === id);
function tocarInv() {
  inv.rev = (inv.rev || 0) + 1; inv.actualizado = Date.now(); LS.set("pa.inv", inv); cola.push("inv"); LS.set("pa.cola", cola);
  clearTimeout(tocarInv.t); tocarInv.t = setTimeout(sincronizar, 800);
}
// Receta de un producto: la del nombre + la de cada detalle (sabor, tamaño o extra). Las preparaciones se abren en sus ingredientes.
function consumoDe(n, d) {
  const out = {};
  const sumar = (partes, factor) => (partes || []).forEach(x => {
    const c = num(x.c) * factor; if (!c) return;
    const pr = prepDe(x.i);
    if (pr) { if (num(pr.rinde) > 0) sumar(pr.partes, c / num(pr.rinde)); }
    else if (insumoDe(x.i)) out[x.i] = (out[x.i] || 0) + c;
  });
  const r = inv.recetas[norm(n)]; if (r) sumar(r.partes, 1);
  String(d || "").split(" · ").map(norm).filter(Boolean).forEach(k => { const rd = inv.recetas["+" + k]; if (rd) sumar(rd.partes, 1); });
  return out;
}
const cuentaEnInventario = p => !(p.devuelto && !p.merma);
function existencias() {
  const hay = {}, desde = {};
  inv.insumos.forEach(x => { hay[x.id] = 0; });
  const lista = Object.values(movs).filter(m => !m.anulado && hay[m.ins] !== undefined).sort((a, b) => a.t - b.t);
  // Lo vendido antes del primer movimiento de un ingrediente no se descuenta (todavía no se llevaba)
  inv.insumos.forEach(x => { const m = lista.find(m => m.ins === x.id); desde[x.id] = m ? m.t - 1 : Infinity; });
  lista.forEach(m => { if (m.tipo === "conteo") { hay[m.ins] = num(m.c); desde[m.ins] = m.t; } });
  lista.forEach(m => { if (m.t > desde[m.ins]) { if (m.tipo === "entrada") hay[m.ins] += num(m.c); if (m.tipo === "merma") hay[m.ins] -= num(m.c); } });
  Object.values(pedidos).forEach(p => {
    if (!cuentaEnInventario(p)) return;
    p.items.forEach(i => Object.entries(consumoDe(i.n, i.d)).forEach(([id, c]) => { if (p.creado > desde[id]) hay[id] -= c * i.q; }));
  });
  // Un ingrediente sin conteo ni compra todavía no se lleva: queda en null y no frena ninguna venta
  inv.insumos.forEach(x => { if (desde[x.id] === Infinity) hay[x.id] = null; });
  return hay;
}
// Para cuántos alcanza lo que hay; null si el producto no tiene receta o ninguno de sus ingredientes tiene stock anotado
function alcanza(n, d, hay = existencias()) {
  const c = Object.entries(consumoDe(n, d)).filter(([id, q]) => q > 0 && hay[id] != null); if (!c.length) return null;
  return Math.min(...c.map(([id, q]) => Math.floor((hay[id] || 0) / q + 1e-9)));
}
// Todo lo que se puede vender, con los mismos nombres del pedido, y los detalles (sabores, tamaños, extras)
function vendibles() {
  const prods = new Map(), dets = new Map();
  menuVenta.forEach(c => c.items.forEach(it => {
    const n = nombreVenta(c, it); prods.set(norm(n), { n, cat: c.cat });
    (it.flavors || []).forEach(f => dets.set(norm(f), f));
    (it.sizes || []).forEach(([t]) => t && dets.set(norm(t), t));
    (it.extras || []).forEach(e => dets.set(norm(e.label), e.label.toLowerCase()));
  }));
  productos().forEach(x => { if (!prods.has(norm(x.n))) prods.set(norm(x.n), { n: x.n, cat: "Otros" }); });
  return { prods: [...prods.values()], dets: [...dets.values()] };

    // Al cambiar de ingrediente la cantidad se pasa a su unidad cuando se puede (kg↔g, L↔ml)
    const de = insumoDe(l.insumo_id), a = insumoDe(el.value), u1 = de ? de.u : l.unidad, u2 = a ? a.u : l.unidad;
    const c = convertir(num(l.cantidad), u1, u2); if (c != null) l.cantidad = Math.round(c * 1000) / 1000;
    else toast(`Revisa la cantidad: estaba en ${u1} y este ingrediente va en ${u2}.`);
    l.insumo_id = el.value; if (!a) l.unidad = u1; pintar();
  }
  if (f === "unidad") { l.unidad = el.value; pintar(); }
});
$("#main").addEventListener("input", e => { const el = e.target, f = el.dataset.fl; if (tab !== "inventario" || !fac.lineas || !(f === "nombre" || f === "cantidad")) return; fac.lineas[+el.dataset.k][f] = el.value; });

// ---------- Ajustes ----------
function pAjustes() {
  return `<h2>Ajustes de este equipo</h2>
  <section class="card"><div class="fields">
    <label>Nombre de este equipo o persona<input data-cfg="equipo" value="${esc(cfg.equipo)}" placeholder="Ej. Ana (teléfono)"></label></div>
    <label class="chk"><input type="checkbox" data-cfg="imprime"${cfg.imprime ? " checked" : ""}> Este equipo imprime los tickets (solo el de la tienda)</label>
    <div class="acts"><button class="btn ghost" data-a="probarImpresion">Imprimir ticket de prueba</button></div>
  </section>
  <section class="card"><h3>Conexión entre equipos</h3>
    <p class="hint">Con esto el teléfono y la PC ven los mismos pedidos. Los datos salen de la cuenta de Supabase (ver la guía).</p>
    <div class="fields">
      <label>URL del proyecto<input data-cfg="url" value="${esc(cfg.url)}" placeholder="https://xxxx.supabase.co"></label>
      <label>Clave pública (anon o publishable)<input data-cfg="key" value="${esc(cfg.key)}"></label>
      <label>Clave de la tienda<input data-cfg="clave" value="${esc(cfg.clave)}"></label></div>
    <div class="acts"><button class="btn" data-a="probar">Probar conexión</button>
    <button class="btn ghost" data-a="copiarcfg">Copiar enlace para otro equipo</button></div>
    <p class="note" id="cfgMsg"></p>
  </section>
  <section class="card"><h3>Productos</h3>
    <p class="hint">Uno por línea: nombre | precio. El nombre debe ser igual al del enlace. Lo que lleva cada uno se anota en Inventario › Recetas.</p>
    <textarea data-cfg="productos" rows="12">${esc(cfg.productos)}</textarea>
  </section>
  <section class="card"><h3>Respaldo</h3>
    <p class="hint">Descarga todo lo de este equipo en un archivo, por si acaso.</p>
    <div class="acts"><button class="btn ghost" data-a="respaldo">Descargar respaldo</button></div>
  </section>`;
}
function copiarConfig() {
  const enlace = location.origin + location.pathname + "#cfg=" + btoa(unescape(encodeURIComponent(JSON.stringify({ url: cfg.url, key: cfg.key, clave: cfg.clave }))));
  const ok = () => { $("#cfgMsg").textContent = "Enlace copiado. Ábrelo en el otro equipo y queda conectado."; };
  try { navigator.clipboard.writeText(enlace).then(ok, () => { $("#cfgMsg").textContent = enlace; }); } catch (_) { $("#cfgMsg").textContent = enlace; }
}
function respaldo() {
  const blob = new Blob([JSON.stringify({ pedidos, dias, inv, movs, cfg: { ...cfg, key: "", clave: "" } }, null, 1)], { type: "application/json" });
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = `caja-pal-antojo-${ahoraCaracas().fecha}.json`; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}

// ---------- imprimir ----------
let colaImpresion = [], imprimiendo = false;
function ticketHTML(p) {
  const tot = p.items.reduce((a, i) => a + i.q * i.p, 0) + (p.delivery || 0), pc = porCobrarDe(p);
  return `<div class="tk"><div class="t">PA'L ANTOJO</div><div style="text-align:center">Calle Urdaneta, local 16 H</div><hr>
    ${p.cambio ? `<div class="big">CAMBIO ${p.cambio}</div>` : ""}
    <div class="row"><b>${esc(p.id)}</b><span>${p.hora || ahoraCaracas().hora}</span></div>
    <div>${esc(p.cliente)}${p.telefono ? ` · ${esc(p.telefono)}` : ""}</div><div>${esc(p.entrega)}${p.mototaxi ? ` · ${esc(p.mototaxi)}` : ""}</div>
    ${p.direccion ? `<div>${esc(p.direccion)}</div>` : ""}${p.nota ? `<div>Nota: ${esc(p.nota)}</div>` : ""}<hr>
    ${p.items.map(i => `<div class="row"><span>${i.q} ${esc(i.n)}${i.d ? ` (${esc(i.d)})` : ""}</span><span>${fmt(i.q * i.p)}</span></div>`).join("")}
    ${p.delivery ? `<div class="row"><span>Delivery</span><span>${fmt(p.delivery)}</span></div>` : ""}<hr>
    <div class="row"><b>TOTAL</b><b>${fmt(tot)}</b></div>
    ${vivos(p).filter(x => x.cobrado).map(x => `<div class="row"><span>${esc(x.forma)}${x.ref ? ` ${esc(x.ref)}` : ""}</span><span>${fmt(x.usd)}</span></div>`).join("")}
    ${pc > 0.01 ? `<div class="big">COBRAR ${fmt(pc)}</div>` : `<div class="big">PAGADO</div>`}</div>`;
}
function imprimir(lista) {
  colaImpresion.push(...lista.filter(Boolean)); if (!imprimiendo) siguienteImpresion();
}
function siguienteImpresion() {
  const p = colaImpresion.shift(); if (!p) { imprimiendo = false; return; }
  imprimiendo = true; $("#ticket").innerHTML = ticketHTML(p);
  setTimeout(() => {
    try { window.print(); } catch (_) { }
    if (pedidos[p.id] && !pedidos[p.id].impreso) { pedidos[p.id].impreso = true; guardarTodo(); }
    setTimeout(siguienteImpresion, 400);
  }, 50);
}

// ---------- sincronización con Supabase ----------
let sincronizando = false;
function pintarSync(txt, tipo) {
  const conectado = cfg.url && cfg.key && cfg.clave;
  const pend = new Set(cola).size;
  if (!txt) {
    if (!conectado) { txt = "Solo este equipo"; tipo = ""; }
    else if (!navigator.onLine) { txt = `Sin internet${pend ? ` · ${pend} por enviar` : ""}`; tipo = "w"; }
    else { txt = pend ? `${pend} por enviar` : "Al día"; tipo = pend ? "w" : "ok"; }
  }
  $("#syncTxt").innerHTML = `<span class="dot ${tipo || ""}"></span>${esc(txt)}`;
}
// Al entrar con el usuario de la tienda, el equipo se conecta solo: la clave la da Supabase (función clave_tienda) a quien puede entrar
const SB_URL = "https://ymzwomnzjfxznmpdouad.supabase.co", SB_KEY = "sb_publishable_DMUusZtVlluniqfi0nrVxQ_pljUvIk5";
let ultimoAuto = 0;
async function conectarSolo() {
  if ((cfg.url && cfg.key && cfg.clave) || !navigator.onLine || Date.now() - ultimoAuto < 30000) return;
  ultimoAuto = Date.now();
  const ses = LS.get("pa.admin.ses", null); if (!ses || !ses.access_token) return;
  try {
    const r = await fetch(SB_URL + "/rest/v1/rpc/clave_tienda", { method: "POST", headers: { apikey: SB_KEY, authorization: "Bearer " + ses.access_token, "content-type": "application/json" }, body: "{}" });
    const clave = r.ok ? await r.json() : null; if (!clave) return;
    cfg.url = cfg.url || SB_URL; cfg.key = cfg.key || SB_KEY; cfg.clave = clave; LS.set("pa.cfg", cfg);
    toast("Equipo conectado a la caja de la tienda.");
  } catch (_) { }
}
async function sincronizar(manual) {
  await conectarSolo();
  if (!(cfg.url && cfg.key && cfg.clave)) { pintarSync(); if (manual) $("#cfgMsg").textContent = "Faltan datos de conexión."; return; }
  if (!navigator.onLine || sincronizando) { pintarSync(); return; }
  sincronizando = true;
  const H = { apikey: cfg.key, "x-clave": cfg.clave, "Content-Type": "application/json" };
  if (cfg.key.startsWith("eyJ")) H.Authorization = "Bearer " + cfg.key;
  const base = cfg.url.replace(/\/+$/, "") + "/rest/v1/registros";
  try {
    const ids = [...new Set(cola)];
    if (ids.length) {
      const filas = ids.map(id => ({ id, datos: id === "inv" ? inv : id.startsWith("mov:") ? movs[id.slice(4)] : id.startsWith("dia:") ? dias[id.slice(4)] : pedidos[id] })).filter(f => f.datos);
      const r = await fetch(base, { method: "POST", headers: { ...H, Prefer: "resolution=merge-duplicates,return=minimal" }, body: JSON.stringify(filas) });
      if (!r.ok) throw new Error(r.status + " " + (await r.text()).slice(0, 160));
      cola = cola.filter(x => !ids.includes(x)); LS.set("pa.cola", cola);
    }
    const desde = estadoSync.ultimo ? new Date(new Date(estadoSync.ultimo).getTime() - 15000).toISOString() : new Date(Date.now() - 3 * 864e5).toISOString();
    const r = await fetch(`${base}?select=id,datos,actualizado&actualizado=gt.${encodeURIComponent(desde)}&order=actualizado.asc&limit=1000`, { headers: H });
    if (!r.ok) throw new Error(r.status + " " + (await r.text()).slice(0, 160));
    const filas = await r.json(); let cambios = false; const porImprimir = [];
    // Un equipo nuevo trae también las recetas y los movimientos de inventario viejos, no solo los de 3 días
    if (!estadoSync.ultimo) { const ri = await fetch(`${base}?select=id,datos,actualizado&or=(id.eq.inv,id.like.mov:*)&limit=10000`, { headers: H }); if (ri.ok) filas.unshift(...await ri.json()); }
    const masNuevo = (d, l) => !l || (d.rev || 0) > (l.rev || 0) || ((d.rev || 0) === (l.rev || 0) && (d.actualizado || 0) > (l.actualizado || 0));
    filas.forEach(f => {
      if (f.id === "inv") { if (masNuevo(f.datos, inv) && !cola.includes("inv")) { inv = f.datos; LS.set("pa.inv", inv); cambios = true; } }
      else if (f.id.startsWith("mov:")) { const k = f.id.slice(4); if ((!movs[k] || (f.datos.rev || 0) > (movs[k].rev || 0)) && !cola.includes(f.id)) { movs[k] = f.datos; LS.set("pa.movs", movs); cambios = true; } }
      else if (f.id.startsWith("dia:")) {
        const k = f.id.slice(4), l = dias[k];
        if (!l || (f.datos.rev || 0) > (l.rev || 0) || ((f.datos.rev || 0) === (l.rev || 0) && (f.datos.actualizado || 0) > (l.actualizado || 0))) { if (!cola.includes(f.id)) { dias[k] = f.datos; cambios = true; } }
      } else {
        const l = pedidos[f.id], d = f.datos;
        const nuevo = !l || (d.rev || 0) > (l.rev || 0) || ((d.rev || 0) === (l.rev || 0) && (d.actualizado || 0) > (l.actualizado || 0));
        if (nuevo && !cola.includes(f.id)) {
          pedidos[f.id] = d; cambios = true;
          if (cfg.imprime && !d.impreso && d.estado !== "devuelto") { porImprimir.push(d); recienLlego = d.id; if (!borrador && tab === "nuevo") { tab = "cocina"; LS.set("pa.tab", tab); } }
        }
      }
      if (!estadoSync.ultimo || f.actualizado > estadoSync.ultimo) estadoSync.ultimo = f.actualizado;
    });
    LS.set("pa.sync", estadoSync);
    if (cambios) {
      guardarTodo();
      if (porImprimir.length) { avisar(); imprimir(porImprimir); porImprimir.forEach(d => { d.impreso = true; d.rev = (d.rev || 0) + 1; d.actualizado = Date.now(); cola.push(d.id); }); guardarTodo(); toast(porImprimir.length === 1 ? `Llegó ${porImprimir[0].id}.` : `Llegaron ${porImprimir.length} pedidos.`); }
      if (!borrador || tab !== "nuevo") { const foco = document.activeElement && document.activeElement.closest("#main input, #main textarea, #main select"); if (!foco) pintar(); else pintarTabs(); }
    }
    pintarSync(); if (manual) $("#cfgMsg").textContent = "Conectado.";
  } catch (err) {
    pintarSync("No se pudo sincronizar", "bad");
    if (manual) $("#cfgMsg").textContent = "Error: " + err.message;
  } finally { sincronizando = false; }
}
function avisar() {
  try { const c = new (window.AudioContext || window.webkitAudioContext)(), o = c.createOscillator(), g = c.createGain(); o.frequency.value = 880; o.connect(g); g.connect(c.destination); g.gain.setValueAtTime(.2, c.currentTime); g.gain.exponentialRampToValueAtTime(.001, c.currentTime + .6); o.start(); o.stop(c.currentTime + .6); } catch (_) { }
}
window.addEventListener("online", () => sincronizar());
window.addEventListener("offline", () => pintarSync());
setInterval(sincronizar, 5000);

// ---------- pegar y arrastrar (PC con WhatsApp Web) ----------
function agregarImagen(file) { if (!file || !file.type.startsWith("image/")) return false; capturas.push(URL.createObjectURL(file)); return true; }
document.addEventListener("paste", e => {
  if (tab !== "nuevo") return;
  const items = [...(e.clipboardData?.items || [])];
  const img = items.find(i => i.type.startsWith("image/"));
  if (img) { e.preventDefault(); agregarImagen(img.getAsFile()); pintar(); toast("Capture agregado."); return; }
  const t = e.clipboardData?.getData("text/plain") || "";
  if (!borrador && /ID de venta|PEDIDO/i.test(t) && e.target.id !== "pegar") { e.preventDefault(); leerTexto(t); }
  else if (!borrador && e.target.id === "pegar" && /ID de venta|PEDIDO/i.test(t)) { setTimeout(() => leerTexto($("#pegar").value), 0); }
});
document.addEventListener("dragover", e => { if (tab === "nuevo") { e.preventDefault(); $("#drop")?.classList.add("over"); } });
document.addEventListener("dragleave", () => $("#drop")?.classList.remove("over"));
document.addEventListener("drop", e => {
  if (tab !== "nuevo") return; e.preventDefault(); $("#drop")?.classList.remove("over");
  const files = [...(e.dataTransfer?.files || [])]; let n = 0; files.forEach(f => { if (agregarImagen(f)) n++; });
  const t = e.dataTransfer?.getData("text/plain");
  if (t && !borrador) leerTexto(t); else if (n) pintar();
});

// ---------- lo que llega por Compartir (teléfono Android) ----------
function abrirDB() {
  return new Promise((ok, mal) => { const r = indexedDB.open("pa-compartidos", 1); r.onupgradeneeded = () => r.result.createObjectStore("items", { keyPath: "t" }); r.onsuccess = () => ok(r.result); r.onerror = () => mal(r.error); });
}
async function leerCompartidos() {
  // Lo compartido se queda guardado hasta que el pedido se guarda o se descarta, porque cada Compartir vuelve a abrir la app
  try {
    const db = await abrirDB();
    const todos = await new Promise(ok => { const q = db.transaction("items").objectStore("items").getAll(); q.onsuccess = () => ok(q.result || []); q.onerror = () => ok([]); });
    const recientes = todos.filter(x => Date.now() - x.t < 30 * 60e3);
    if (!recientes.length) return;
    capturas = [];
    recientes.forEach(x => (x.files || []).forEach(agregarImagen));
    const nuevos = recientes.filter(x => x.text && !x.usado);
    const texto = nuevos.map(x => x.text).join("\n");
    if (nuevos.length) await new Promise(ok => { const tx = db.transaction("items", "readwrite"); nuevos.forEach(x => tx.objectStore("items").put({ ...x, usado: true })); tx.oncomplete = ok; tx.onerror = ok; });
    tab = "nuevo"; LS.set("pa.tab", tab);
    if (texto.trim() && !borrador) leerTexto(texto);
    else { pintar(); if (!texto.trim()) toast(borrador ? "Capture agregado al pedido." : "Llegó el capture. Ahora comparte el mensaje del pedido."); }
  } catch (_) { }
}
async function limpiarCompartidos() {
  try { const db = await abrirDB(); const tx = db.transaction("items", "readwrite"); tx.objectStore("items").clear(); } catch (_) { }
}

// ---------- arranque ----------
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => { });
pintar(); pintarSync();
if (new URLSearchParams(location.search).has("compartido")) { history.replaceState(null, "", location.pathname); }
leerCompartidos();
document.addEventListener("visibilitychange", () => { if (!document.hidden) { leerCompartidos(); sincronizar(); } });
sincronizar();
</script>
