<style>
/* App del repartidor: un interruptor de "disponible", la oferta con su cuenta regresiva, sus pedidos y sus cuentas. Pensada para el teléfono. */
:root {

  --display: "Fredoka", "Trebuchet MS", system-ui, sans-serif; --body: "Nunito", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) { :root {
  --bg: #151410; --surface: #201E18; --line: #38342A; --fg: #F3EEE0; --muted: #A8A291;
  --ok: #6FCF8A; --okbg: #1B3324; --bad: #F08A82; --badbg: #3A1E1C; --warnbg: #3A3115; color-scheme: dark } }
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--fg); font: 16px/1.45 var(--body); padding-bottom: calc(24px + env(safe-area-inset-bottom, 0px)); }
h1, h2, h3 { font-family: var(--display); margin: 0; line-height: 1.15; }
p { margin: 0; }
[hidden] { display: none !important; }
.top { position: sticky; top: 0; z-index: 3; background: var(--ink); color: #F3EEE0; padding: calc(10px + env(safe-area-inset-top, 0px)) 16px 10px; display: flex; align-items: center; gap: 10px; }

.top small { display: block; color: #CFC8B4; font: 700 .8rem var(--body); }
.top button { background: none; border: 0; color: #CFC8B4; font: 700 .85rem var(--body); cursor: pointer; padding: 6px; }
main { max-width: 560px; margin: 0 auto; padding: 14px 16px; display: grid; gap: 14px; }
.card { background: var(--surface); border: 1.5px solid var(--line); border-radius: 16px; padding: 14px; display: grid; gap: 10px; min-width: 0; }
.btn { border: 0; background: var(--fg); color: var(--surface); border-radius: 12px; padding: 12px 16px; font: 800 1rem var(--body); cursor: pointer; text-decoration: none; text-align: center; display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
.btn.brand { background: var(--brand); color: var(--ink); }
.btn.ghost { background: var(--line); color: var(--fg); }
.btn.ok { background: var(--ok); color: #fff; }
.btn.big { padding: 16px; font-size: 1.15rem; }
.btn:disabled { opacity: .45; }
.fila { display: flex; flex-wrap: wrap; gap: 8px; }
.fila > * { flex: 1 1 140px; }
.hint { color: var(--muted); font-size: .9rem; }
.msg { font-size: .92rem; font-weight: 700; border-radius: 10px; padding: 8px 12px; }
.msg.ok { background: var(--okbg); color: var(--ok); } .msg.bad { background: var(--badbg); color: var(--bad); } .msg.w { background: var(--warnbg); }

.estado b { font: 700 1.2rem var(--display); }
.sw { margin-left: auto; position: relative; width: 64px; height: 36px; border-radius: 99px; border: 0; background: var(--line); cursor: pointer; flex: none; }
.sw::after { content: ""; position: absolute; top: 4px; left: 4px; width: 28px; height: 28px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgb(0 0 0 / .3); transition: transform .15s; }
.sw[aria-checked="true"] { background: var(--ok); }
.sw[aria-checked="true"]::after { transform: translateX(28px); }
.punto { width: 12px; height: 12px; border-radius: 50%; background: #999; flex: none; }
.punto.on { background: #2E9E5B; box-shadow: 0 0 0 4px rgb(46 158 91 / .2); }
/* Oferta */
.oferta { background: var(--brand); color: var(--ink); border: 0; animation: llega .5s ease; }
.oferta h2 { font-size: 1.35rem; }
.oferta .hint { color: #4a3f10; }
.oferta .dir { font: 700 1.1rem var(--display); }
.datos { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.datos div { background: rgb(255 255 255 / .55); border-radius: 10px; padding: 8px; display: grid; }
.card:not(.oferta) .datos div { background: var(--bg); }
.datos small { font: 800 .7rem var(--body); text-transform: uppercase; letter-spacing: .05em; opacity: .75; }
.datos b { font: 700 1.05rem var(--display); font-variant-numeric: tabular-nums; }
.reloj { height: 8px; border-radius: 99px; background: rgb(0 0 0 / .15); overflow: hidden; }
.reloj i { display: block; height: 100%; background: var(--ink); transition: width 1s linear; }
@keyframes llega { from { transform: scale(.96); opacity: .4; } }
.pill { font: 800 .72rem var(--body); text-transform: uppercase; letter-spacing: .05em; border-radius: 6px; padding: 2px 8px; background: var(--line); white-space: nowrap; }
.pill.w { background: var(--warnbg); } .pill.g { background: var(--okbg); color: var(--ok); }
.oh { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.oh b { font: 700 1.1rem var(--display); }
label { display: grid; gap: 4px; font-weight: 800; font-size: .9rem; }
input { font: 700 1.1rem var(--body); padding: 10px 12px; border: 1.5px solid var(--line); border-radius: 10px; background: var(--surface); color: var(--fg); width: 100%; }
.cuentas { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.cuentas div { border: 1.5px solid var(--line); border-radius: 12px; padding: 10px; display: grid; }
.cuentas small { color: var(--muted); font-weight: 700; font-size: .78rem; }
.cuentas b { font: 700 1.25rem var(--display); }
.hist { display: grid; gap: 6px; margin-top: 8px; }
.hist div { display: flex; justify-content: space-between; gap: 8px; font-size: .92rem; border-bottom: 1px solid var(--line); padding-bottom: 6px; }
details summary { cursor: pointer; font-weight: 800; }
#toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: #fff; padding: 10px 16px; border-radius: 12px; font-weight: 700; z-index: 9; max-width: calc(100% - 32px); }
</style>
<script src="../caja/acceso.js" data-permiso="es_repartidor" data-texto="Para los repartidores de Pa'l Antojo. Entra con el correo y la contraseña que te dio la tienda."></script>

<script>
// ---------- conexión ----------
const SB_URL = "https://ymzwomnzjfxznmpdouad.supabase.co", SB_KEY = "sb_publishable_DMUusZtVlluniqfi0nrVxQ_pljUvIk5";

// ---------- estado ----------
let disponible = LS.get("dlv.disponible", false);

let entregando = {}, ocupado = false, pantalla = null;

// GPS: solo mientras está disponible. Sirve para darle el pedido al que está más cerca del local.
function vigilarGps() {
  if (!disponible || vigia !== null || !navigator.geolocation) { if (!navigator.geolocation) gpsError = "Este teléfono no tiene GPS."; return; }

}

    const p = { disponible };

  } catch (e) { error = e.message; if (e.sesion && window.salirApp) window.salirApp(); }

}

// ---------- avisos ----------
let pito = null;
function sonar() {
  try { const c = sonar.c || (sonar.c = new (window.AudioContext || window.webkitAudioContext)());
    [0, .25].forEach(d => { const o = c.createOscillator(), g = c.createGain(); o.frequency.value = 988; o.connect(g); g.connect(c.destination); g.gain.setValueAtTime(.3, c.currentTime + d); g.gain.exponentialRampToValueAtTime(.001, c.currentTime + d + .2); o.start(c.currentTime + d); o.stop(c.currentTime + d + .2); });

}

  sonar(); clearInterval(pito); pito = setInterval(() => { if (datos && datos.oferta) sonar(); else clearInterval(pito); }, 3000);

  }

const b64u = s => Uint8Array.from(atob(s.replace(/-/g, "+").replace(/_/g, "/") + "===".slice((s.length + 3) % 4)), c => c.charCodeAt(0));

  try {
    if (typeof Notification === "undefined" || !("serviceWorker" in navigator)) { if (!callado) toast("Este teléfono no tiene avisos. En iPhone, primero agrega la app a la pantalla de inicio."); return; }

// ---------- acciones ----------
async function cambiarDisponible() {

    if (a === "aceptar") { const ok = await rpc("dlv_aceptar", { eid: id }); clearInterval(pito); toast(ok ? "¡Es tuyo! Pasa por el local a buscarlo." : "Se te pasó el tiempo. Ya se le ofreció a otro."); }

// ---------- permisos: la primera vez sale una pantalla para aceptar ubicación y notificaciones ----------
let permisoGps = "prompt";

// ---------- pantalla ----------
const tel58 = t => { let d = String(t || "").replace(/\D/g, ""); if (d.startsWith("0")) d = "58" + d.slice(1); else if (d.length === 10) d = "58" + d; return d; };

function pintar() {
  if (!datos && error) { $("#app").innerHTML = `<p class="msg bad">${esc(error)}</p><button class="btn ghost" onclick="latido()">Intentar de nuevo</button>`; return; }

  if (faltanPermisos()) { $("#app").innerHTML = pantallaPermisos(); return; }
  const o = datos.oferta, hoy = datos.hoy || {}, ahora = Date.now() + (desfase || 0);
  const resta = o ? Math.max(0, Math.round((Date.parse(o.hasta) - ahora) / 1000)) : 0;
  const yaEnPantalla = $("#app").dataset.vista;
  const html = `
  ${error ? `<p class="msg bad">${esc(error)}</p>` : ""}
  ${o ? `<section class="card oferta">
    <div class="oh"><h2>¡Pedido para llevar!</h2><span class="pill">${resta} s</span></div>

      <p class="hint">${disponible ? (gps ? `GPS activo${datos.yo && datos.yo.km != null ? ` · estás a ${String(datos.yo.km).replace(".", ",")} km del local` : ""}` : gpsError ? esc(gpsError) + " Igual te llegan pedidos, pero después de los que tienen GPS." : "Buscando tu ubicación…") : "Actívalo cuando puedas llevar pedidos."}</p></div>
      <button class="sw" role="switch" aria-checked="${disponible}" aria-label="Disponible" onclick="cambiarDisponible()"></button></div>
    ${!datos.yo.avisos || avisoPermiso !== "granted" ? `<div class="msg w">Activa los avisos para que te llegue el pedido aunque tengas la app cerrada.<div style="margin-top:8px"><button class="btn brand" onclick="activarAvisos()">Activar avisos</button></div></div>` : ""}
    ${disponible ? `<button class="btn ghost" onclick="mantenerPrendida()">${pantalla ? "✓ Pantalla siempre prendida" : "Mantener la pantalla prendida"}</button>` : ""}
  </section>
  ${datos.mias.map(m => {
    const mp = mapa(m), t = tel58(m.telefono);
    return `<section class="card">
    <div class="oh"><b>${esc(m.cliente || "Cliente")}</b><span class="pill ${m.estado === "en_camino" ? "g" : "w"}">${m.estado === "en_camino" ? "En camino" : "Buscar en el local"}</span></div>
    <p>${esc(m.direccion || "")}</p>
    <div class="datos"><div><small>Envío</small><b>${fmt(m.envio)}</b></div><div><small>Cobrar</small><b>${+m.cobrar > 0 ? fmt(m.cobrar) : "Pagado"}</b></div><div><small>Del local</small><b>${m.km_cliente != null ? String(m.km_cliente).replace(".", ",") + " km" : "—"}</b></div></div>
    ${m.resumen ? `<p class="hint">${esc(m.resumen)}</p>` : ""}${m.nota ? `<p class="hint">Nota: ${esc(m.nota)}</p>` : ""}
    <div class="fila">${mp ? `<a class="btn ghost" href="${esc(mp)}" target="_blank" rel="noopener">📍 Mapa</a>` : ""}${t ? `<a class="btn ghost" href="tel:+${t}">📞 Llamar</a><a class="btn ghost" href="https://wa.me/${t}" target="_blank" rel="noopener">💬 WhatsApp</a>` : ""}</div>
    ${entregando[m.id] ? `<label>¿Cuánto efectivo cobraste?<input id="cob-${esc(m.id)}" inputmode="decimal" value="${String(m.cobrar).replace(".", ",")}"></label>` : ""}
    <div class="fila">${m.estado === "asignado" ? `<button class="btn brand" data-a="salio" data-id="${esc(m.id)}">Salí del local</button>` : ""}<button class="btn ok" data-a="entregado" data-id="${esc(m.id)}">${entregando[m.id] ? "Confirmar entrega" : "Entregado"}</button></div>
  </section>`; }).join("")}
  <section class="card">
    <h3>Hoy</h3>
    <div class="cuentas"><div><small>Pedidos</small><b>${hoy.pedidos || 0}</b></div><div><small>Envíos</small><b>${fmt(hoy.envios)}</b></div><div><small>Efectivo cobrado</small><b>${fmt(hoy.efectivo)}</b></div></div>
    <p class="hint">Envíos que la tienda todavía no te ha pagado: <b>${fmt(datos.por_cobrar)}</b>. El efectivo que cobraste se entrega en el local.</p>
    ${datos.historial.length ? `<details><summary>Últimas entregas</summary><div class="hist">${datos.historial.map(h => `<div><span>${esc(new Date(h.entregado).toLocaleString("es-VE", { timeZone: "America/Caracas", day: "numeric", month: "short", hour: "numeric", minute: "2-digit" }))} · ${esc(h.cliente || "")}</span><span>${fmt(h.envio)}${h.pagado ? " ✓" : ""}</span></div>`).join("")}</div><p class="hint" style="margin-top:6px">✓ = envío ya pagado.</p></details>` : ""}
  </section>`;
  // No se repinta mientras escribe el efectivo cobrado
  if (document.activeElement && document.activeElement.id && document.activeElement.id.startsWith("cob-")) return;
  $("#app").innerHTML = html; $("#app").dataset.vista = "1";
}
$("#app").addEventListener("click", e => { const b = e.target.closest("button[data-a]"); if (b) accion(b.dataset.a, b.dataset.id, b); });

// Hora del servidor (para la cuenta regresiva aunque el reloj del teléfono esté mal)
let desfase = 0;
const _rpc = rpc;
rpc = async (f, c) => { const d = await _rpc(f, c); if (d && d.ahora) { const x = Date.parse(d.ahora) - Date.now(); if (Math.abs(x) > 3000) desfase = x; else desfase = 0; } return d; };

// Cada 4 segundos si está disponible o lleva un pedido; si no, cada 20. La cuenta regresiva se mueve cada segundo.
let reloj = null;
function reprogramar() { clearInterval(reloj); const rapido = disponible || (datos && datos.mias.length); reloj = setInterval(latido, rapido ? 4000 : 20000); }
setInterval(() => { if (datos && datos.oferta) pintar(); }, 1000);
document.addEventListener("visibilitychange", async () => {
  if (document.hidden) return; latido();
  if (LS.get("dlv.pantalla", false) && !pantalla && disponible && "wakeLock" in navigator) try { pantalla = await navigator.wakeLock.request("screen"); } catch (_) { }
});
window.addEventListener("online", latido);
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => { });
navigator.serviceWorker && navigator.serviceWorker.addEventListener("message", e => { if (e.data === "latido") latido(); });
if (disponible) vigilarGps();
revisarPermisos();
// Espera a que acceso.js confirme la sesión
(function arrancar() { if (document.documentElement.classList.contains("bloqueado") || !LS.get("pa.admin.ses", null)) return setTimeout(arrancar, 500); latido(); reprogramar(); })();
</script>
</body>
</html>
